;; pgbouncer.ini — local transaction-mode pooler for the azeebo dev stack.
;;
;; Point-of-the-setup: ~28 services each held their own Prisma pool against
;; one Postgres (max_connections=100) and idle slots piled up until services
;; failed with "remaining connection slots are reserved for SUPERUSER" (see
;; RUNBOOK). Per-service connection_limit caps (apply-pool-limits.mjs) bound
;; the worst case, but pgbouncer removes the floor entirely: services now
;; multiplex over a small shared set of real server connections.
;;
;;   mode         transaction (Prisma-supported; see pgbouncer=true below)
;;   listen       127.0.0.1:6432
;;   backend      127.0.0.1:5432 (local Homebrew postgresql@18)
;;   auth         trust both sides — loopback dev only, NOT a template for prod
;;   databases    every azeebo_* database via the same wildcard entry
;;
;; Managed by scripts/database/start-pgbouncer.mjs, which generates
;; userlist.txt and (re)starts the daemon. Manual start:
;;   pgbouncer -d scripts/database/pgbouncer.ini
;; Stop: pkill -f "pgbouncer.*pgbouncer.ini" ; reload: kill -SIGHUP <pid>

[databases]
;; = * : connect clients to the same-named database on the server.
* = host=127.0.0.1 port=5432

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432

; The entire point of this setup: transaction pooling. A server connection
; is assigned per transaction, not per client session — 28 services can then
; multiplex over a couple dozen real Postgres connections.
pool_mode = transaction

; Loopback only — never expose this on a LAN interface.
; = * = same database name on the backend; auth_type=trust because the
; backend Postgres itself is trust-authenticated on loopback and service
; .env files carry varying dev passwords (an md5 userlist cannot represent
; per-service password variance). DEV ONLY — prod must use md5/scram + TLS.
auth_type = trust
auth_file = scripts/database/userlist.txt

; Admin console access (SHOW POOLS, RELOAD, etc.) via the pgbouncer pseudo-user.
admin_users = pgbouncer
stats_users = pgbouncer

; ── Pool sizing ──────────────────────────────────────────────────────────
; The whole point: a small fixed server-side pool shared by all services.
; 20 server connections is ~20% of max_connections=100, leaving ample
; headroom for superuser/psql sessions and anything bypassing the pooler.
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Client-side slack: services rarely hold >5 concurrent conns each.
max_client_conn = 200

; ── Transaction-mode safety ──────────────────────────────────────────────
; Session features break in transaction mode; make the failure modes loud.
; Prisma uses server-side prepared statements ONLY when it must (raw
; deployments with pgbouncer=true use the text protocol), and describes
; results lazily — both are transaction-mode safe. prepare thresholds:
server_reset_query = DISCARD ALL
server_check_delay = 10

; Track per-client/server accounting so admin console shows real usage.
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; Housekeeping
idle_transaction_timeout = 60
query_wait_timeout = 120
cancel_wait_timeout = 10
server_idle_timeout = 300
server_lifetime = 3600

; pid/log files written next to this ini by the start script
pidfile = /tmp/azeebo-pgbouncer.pid
logfile = /tmp/azeebo-pgbouncer.log

; Loopback dev box: no TLS. In production, terminate TLS here or in front.
server_tls_sslmode = disable
client_tls_sslmode = disable

; Ignore startup parameters Prisma sends that pgbouncer can't track per-db.
ignore_startup_parameters = extra_float_digits,search_path
