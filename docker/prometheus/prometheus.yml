global:
  scrape_interval: 15s
  evaluation_interval: 15s

# AUD-11: rules are evaluated below but delivery requires an Alertmanager —
# this must match the alertmanager service in docker/docker-compose.monitoring.yml.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Port map below mirrors the PORT environment each service receives in
  # docker-compose.prod.yml (and the all-in-one SERVICE table). When adding a
  # service, update both compose and this list in the same change.

  # API Gateway
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3013']
    metrics_path: '/metrics'

  # Core Services
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3000']
    metrics_path: '/metrics'

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:3001']
    metrics_path: '/metrics'

  - job_name: 'content-service'
    static_configs:
      - targets: ['content-service:3004']
    metrics_path: '/metrics'

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:3003']
    metrics_path: '/metrics'

  - job_name: 'wallet-service'
    static_configs:
      - targets: ['wallet-service:3002']
    metrics_path: '/metrics'

  - job_name: 'media-service'
    static_configs:
