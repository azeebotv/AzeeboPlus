# AUD-11: minimal Alertmanager routing so Prometheus alerts have a delivery
# target. Replace the webhook URL with the team's paging sink (Slack
# gateway, PagerDuty events API, etc.) when one is provisioned.
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

receivers:
  - name: 'default'
    webhook_configs:
      # Dead sink by default: alerts are accepted and recorded here until a
      # real receiver URL is configured, so delivery failures are visible in
      # Alertmanager's own UI rather than alerts silently vanishing.
      - url: 'http://localhost:5001/'
        send_resolved: true
