  # ============================================================
  # FRONTEND
  # ============================================================
  web-app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://app.azeebo.com}
    container_name: azeebo_prod_web
    ports:
      - "${WEB_PORT:-4000}:3000"
    environment:
      NODE_ENV: production
      API_GATEWAY_URL: http://api-gateway:3013
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://app.azeebo.com}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_URL:-https://app.azeebo.com}
    networks:
      - frontend
      - backend
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    profiles:
      - frontend
      - all

  admin-app:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: azeebo_prod_admin
    ports:
      - "${ADMIN_PORT:-4016}:3016"
    environment:
      <<: *common-env
      PORT: "3016"
      DATABASE_URL: postgresql://${ADMIN_DB_USER:-admin_user}:${ADMIN_DB_PASSWORD}@pgbouncer:6432/admin_db?schema=public
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    profiles:
      - frontend
      - all

  creator-portal-app:
    build:
      context: .
      dockerfile: apps/creator-portal/Dockerfile
    container_name: azeebo_prod_creator_portal
    ports:
      - "${CREATOR_PORTAL_PORT:-4014}:3014"
    environment:
      <<: *common-env
      PORT: "3014"
      DATABASE_URL: postgresql://${CREATOR_PORTAL_DB_USER:-creator_portal_user}:${CREATOR_PORTAL_DB_PASSWORD}@pgbouncer:6432/creator_portal_db?schema=public
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    profiles:
      - frontend
      - all

# ============================================================
# NETWORKS
# ============================================================
networks:
  data:
    driver: bridge
    name: azeebo_prod_data
  backend:
    driver: bridge
    name: azeebo_prod_backend
  frontend:
    driver: bridge
    name: azeebo_prod_frontend

# ============================================================
# VOLUMES
# ============================================================
volumes:
  postgres-data:
    driver: local
    name: azeebo_prod_postgres_data
  redis-data:
    driver: local
    name: azeebo_prod_redis_data
