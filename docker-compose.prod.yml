  # ============================================================

  api-gateway:
    build:
      context: .
      dockerfile: services/gateway/api-gateway/Dockerfile
    container_name: azeebo-gateway
    environment:
      <<: *common-env
      PORT: "3013"
      SERVICE_NAME: api-gateway
      # AUD-04: explicit upstream for the knowledge route. Every other route
      # relies on the SERVICE_CONFIGS fallbackUrl; pinning this one makes the
      # correct port visible at the deployment layer and overridable per env.
      KNOWLEDGE_SERVICE_URL: ${KNOWLEDGE_SERVICE_URL:-http://knowledge-service:3020}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3013}:3013"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3013/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - azeebo-internal
      - azeebo-public

