# ============================================================
# Azeebo+ Production Docker Deployment
# Usage:
#   Build:  docker compose -f docker-compose.prod.yml build
#   Start:  docker compose -f docker-compose.prod.yml up -d
#   Logs:   docker compose -f docker-compose.prod.yml logs -f [service]
#   Stop:   docker compose -f docker-compose.prod.yml down
#   Full:   docker compose -f docker-compose.prod.yml --profile all up -d
# ============================================================

x-common-env: &common-env
  NODE_ENV: production
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  POSTGRES_HOST: pgbouncer
  POSTGRES_PORT: "6432"

x-nestjs-service: &nestjs-service
  restart: unless-stopped
  networks:
    - azeebo-network
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    pgbouncer:
      condition: service_started
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:${PORT:-3000}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

# ============================================================
# SERVICES
# ============================================================
services:

  # ============================================================
  # INFRASTRUCTURE
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: azeebo_prod_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-azeebo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-azeebo_plus}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/docker-init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-azeebo} -d ${POSTGRES_DB:-azeebo_plus}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    sysctls:
      - net.core.somaxconn=1024
    command: >
      postgres
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c work_mem=16MB
        -c maintenance_work_mem=256MB
        -c max_connections=200
        -c wal_buffers=16MB
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
        -c log_min_duration_statement=1000
        -c log_statement=ddl

  redis:
    image: redis:7-alpine
    container_name: azeebo_prod_redis
    command: >
      redis-server
        --appendonly yes
        --appendfsync everysec
        --no-appendfsync-on-rewrite yes
        --auto-aof-rewrite-percentage 100
        --auto-aof-rewrite-min-size 64mb
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
        --save 60 10000
        --tcp-keepalive 300
        --timeout 0
        --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    container_name: azeebo_prod_pgbouncer
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-azeebo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-azeebo_plus}
      POOL_MODE: session
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      AUTH_TYPE: scram-sha-256
      SERVER_TLS_SSLMODE: prefer
      LOG_CONNECTIONS: 1
      LOG_DISCONNECTIONS: 1
      ADMIN_USERS: ${POSTGRES_USER:-azeebo}
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    depends_on:
      postgres:
        condition: service_healthy

