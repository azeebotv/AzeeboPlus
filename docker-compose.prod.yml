# ============================================================
# Azeebo+ Production Docker Compose
# ============================================================
# Full microservice deployment with separate containers.
#
# Usage:
#   1. Copy .env.example to .env and fill in production values
#   2. docker compose -f docker-compose.prod.yml build
#   3. docker compose -f docker-compose.prod.yml up -d
#
# Architecture:
#   - PostgreSQL 16 (primary database)
#   - Redis 7 (caching, sessions, feature flags, event bus)
#   - 29 backend microservices (NestJS)
#   - 3 frontend apps (Next.js, Vite)
#   - Nginx reverse proxy (optional)
#
# Requirements: 16GB RAM, 8 CPU cores minimum
# ============================================================

x-common-env: &common-env
  NODE_ENV: production
  # Database
  DATABASE_URL: postgresql://azeebo:${POSTGRES_PASSWORD}@postgres:5432/azeebo?schema=public&sslmode=require
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  # Event bus (Redis pub/sub) — used by services that publish/subscribe
  # domain events (wallet-service, creator-service wallet snapshots, ...)
  EVENT_BUS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  # Auth
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY}
  GATEWAY_SECRET: ${GATEWAY_SECRET}
  JWT_AUDIENCE: azeebo-api
  JWT_ISSUER: azeebo-auth
  # Gateway
  API_GATEWAY_URL: http://api-gateway:3013
  # CORS
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://app.azeeboplus.com,https://admin.azeeboplus.com,https://creator.azeeboplus.com}
  # Logging
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: json
  # Rate Limiting
  RATE_LIMIT_TTL: "60"
  RATE_LIMIT_MAX: "100"

services:
  # ============================================================
  # Infrastructure
  # ============================================================

  postgres:
    image: postgres:16-alpine
    container_name: azeebo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-azeebo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-azeebo}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-azeebo} -d ${POSTGRES_DB:-azeebo}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    shm_size: 256m
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - azeebo-internal

  redis:
    image: redis:7-alpine
    container_name: azeebo-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - azeebo-internal

  # ============================================================
  # Core Services
  # ============================================================

  auth-service:
    build:
      context: .
      dockerfile: services/core/auth-service/Dockerfile
    container_name: azeebo-auth
