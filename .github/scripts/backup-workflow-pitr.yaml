# Backup Workflow Enhancement for PITR
# Add this to existing backup workflow

name: Backup with PITR
on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

env:
  BACKUP_BUCKET: s3://azeebo-backups-postgres
  PGDATA: /var/lib/postgresql/data

jobs:
  backup-and-pitr:
    name: Backup with Point-in-Time Recovery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Trigger base backup
        run: |
          kubectl exec deploy/postgres -- pg_basebackup \
            --pgdata=/tmp/backup \
            --format=plain \
            --compress \
            --label=base_backup_$(date +%Y%m%d)

      - name: Upload base backup to S3
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          aws s3 sync /tmp/backup ${BACKUP_BUCKET}/base/${TIMESTAMP}/ --storage-class STANDARD_IA

      - name: Verify WAL archiving
        run: |
          # Check last WAL segment
          kubectl exec deploy/wal-g -- ls -la /var/lib/postgresql/data/pg_wal/ | tail -5

      - name: Test restore procedure
        run: |
          echo "PITR restore procedure documented in scripts/restore-pitr.sh"
          echo "To restore: ./scripts/restore-pitr.sh '<timestamp>'"