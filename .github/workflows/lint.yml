name: Lint

on:
  push:
    branches: [Dev-Branch]
  pull_request:
    branches: [Dev-Branch]

env:
  NODE_VERSION: '22.16.0'
  PNPM_VERSION: '10.33.2'

jobs:
  lint-web:
    name: Lint Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @azeebo/web lint

  lint-admin:
    name: Lint Admin App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @azeebo/admin lint

  lint-creator:
    name: Lint Creator App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @azeebo/creator lint

  lint-mobile:
    name: Lint Mobile App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No `--if-present`: pnpm forwards it to the script's binary, and eslint
      # rejects it as an unknown option. The mobile lint script exists.
      - run: pnpm --filter @azeebo/mobile lint

  lint-backend:
    name: Lint Backend Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      # Ratchet: per-rule, per-workspace warning baselines from
      # scripts/promotion-rules.json. require-map-and-throw is fully gated
      # (error, baseline 0 = canary — see the script header for both postures);
      # the gate also floors any future warn-while-migrating rule.
      - run: pnpm run check:lint-ratchet
      # Tripwire: every rule in scripts/promotion-rules.json must resolve to
      # 'error' severity for every service — fails if the rule is downgraded,
      # scope-exceptioned, or left unconfigured for a service.
      - run: pnpm run check:rule-promotion
      # Dead-code ratchet: knip's unused-file/export/type counts per workspace
      # may only decrease against scripts/dead-exports-baseline.json
      # (regenerate with: node scripts/check-dead-exports.mjs --update).
      - run: pnpm run check:dead-exports

  license-gate:
    name: License Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on non-permissive prod licenses not explicitly allowlisted in
      # scripts/check-licenses.mjs; regenerate THIRD_PARTY_NOTICES.md with
      # `pnpm ops:licenses --write-attribution`.
      - run: pnpm ops:licenses

