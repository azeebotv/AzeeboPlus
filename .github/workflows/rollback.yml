name: Rollback Deployment

# Rolls back to a specific Docker image tag.
# The deployment method (Coolify webhook or SSH) mirrors cd.yml exactly.
# Both the staging and production environments require GitHub Environment approvals.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      target_tag:
        description: 'Docker image tag to rollback to (e.g. staging-abc1234 or a previous SHA)'
        required: true

env:
  # Same identity cd.yml publishes and the compose files interpolate. Never
  # derive image refs from github.repository: it preserves casing (AzeeboPlus)
  # and Docker rejects uppercase repository names.
  REGISTRY: ghcr.io
  IMAGE_NAME: azeebotv/azeebo-all-in-one

permissions:
  contents: read
  # The verify step reads the GHCR package version list to confirm the
  # rollback target tag actually exists (packages/container/.../versions needs
  # packages: read; with contents-only the call 403s and the step silently
  # degrades to "attempting rollback anyway").
  packages: read

jobs:
  resolve-domains:
    name: Resolve platform domains
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      staging_url: ${{ steps.urls.outputs.staging_url }}
      production_url: ${{ steps.urls.outputs.production_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Derive URLs from domain registry
        id: urls
        run: |
          node scripts/generate-domain-env.mjs --check
          . deploy/domains.env
          echo "staging_url=https://${STAGING_HOST}" >> "$GITHUB_OUTPUT"
          echo "production_url=https://${BASE_DOMAIN}" >> "$GITHUB_OUTPUT"

  rollback:
    name: Rollback to ${{ inputs.target_tag }} on ${{ inputs.environment }}
    needs: [resolve-domains]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'staging' && (vars.STAGING_BASE_URL || needs.resolve-domains.outputs.staging_url) || (vars.PRODUCTION_BASE_URL || needs.resolve-domains.outputs.production_url) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Verify target image exists in GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.target_tag }}"
          echo "🔍 Verifying tag: $TAG"
          if ! gh api "repos/${{ github.repository }}/packages/container/azeebo-all-in-one/versions" \
              --jq '.[].metadata.container.tags[]' 2>/dev/null | grep -qx "$TAG"; then
            echo "::warning::Tag $TAG not found in GHCR package list — attempting rollback anyway (tag may be in a different package)"
          else
            echo "✅ Tag $TAG confirmed in GHCR"
          fi

      # Coolify deploys the tag its Compose app resolves from IMAGE_TAG; its
      # deploy API's `tag` parameter means a Coolify resource-tag group, so it
      # cannot select a Docker tag. Set IMAGE_TAG, then trigger.
      - name: Select image tag in Coolify (Staging)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        if: inputs.environment == 'staging' && env.COOLIFY_WEBHOOK != ''
        run: |
          bash scripts/coolify-set-image-tag.sh "${{ inputs.target_tag }}"

      - name: Rollback via Coolify (Staging)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
        if: inputs.environment == 'staging' && env.COOLIFY_WEBHOOK != ''
        run: |
          echo "🔄 Triggering Coolify staging rollback to ${{ inputs.target_tag }}..."
          curl -fsSL -X POST "$COOLIFY_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{"force":false}'
          echo "✅ Coolify staging rollback triggered"

      - name: Select image tag in Coolify (Production)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        if: inputs.environment == 'production' && env.COOLIFY_WEBHOOK != ''
        run: |
          bash scripts/coolify-set-image-tag.sh "${{ inputs.target_tag }}"

      - name: Rollback via Coolify (Production)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}
        if: inputs.environment == 'production' && env.COOLIFY_WEBHOOK != ''
        run: |
          echo "🔄 Triggering Coolify production rollback to ${{ inputs.target_tag }}..."
          curl -fsSL -X POST "$COOLIFY_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{"force":false}'
          echo "✅ Coolify production rollback triggered"

      - name: Rollback via SSH (Fallback — Staging)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
          DEPLOY_SSH_KEY_SET: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        if: inputs.environment == 'staging' && env.COOLIFY_WEBHOOK == '' && env.DEPLOY_SSH_KEY_SET == 'true'
        uses: appleboy/ssh-action@029f5b4aeefc5ef18188244d3a88aaae867b0a8a # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "🔄 Rolling back staging to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.target_tag }}"
            docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.target_tag }}"
            docker stop azeebo-staging || true
            docker rm azeebo-staging || true
            docker run -d \
              --name azeebo-staging \
              -p 3013:3013 \
              -p 4000:4000 \
              -p 4014:4014 \
              -p 4016:4016 \
              --env-file /opt/azeebo/.env.staging \
              --restart unless-stopped \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.target_tag }}"
            echo "✅ Staging rollback complete"

      - name: Rollback via SSH (Fallback — Production)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}
          DEPLOY_SSH_KEY_SET: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        if: inputs.environment == 'production' && env.COOLIFY_WEBHOOK == '' && env.DEPLOY_SSH_KEY_SET == 'true'
        uses: appleboy/ssh-action@029f5b4aeefc5ef18188244d3a88aaae867b0a8a # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "🔄 Rolling back production to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.target_tag }}"
            docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.target_tag }}"
            docker stop azeebo || true
            docker rm azeebo || true
            docker run -d \
              --name azeebo \
              -p 3013:3013 \
              -p 4000:4000 \
              -p 4014:4014 \
              -p 4016:4016 \
              --env-file /opt/azeebo/.env.production \
              --restart unless-stopped \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.target_tag }}"
            echo "✅ Production rollback complete"

      # Same gate as cd.yml, so a rollback is proven the way a deploy is: a
      # green /health only says something answers, not that the tag we restored
      # is the build running. --rollback additionally accepts a moving tag
      # (latest, staging) and titles the step summary a rollback, naming the tag
      # that was restored and the commit that came back up.
      - name: Verify restored image tag
        env:
          HEALTH_URL: ${{ inputs.environment == 'staging' && vars.STAGING_HEALTH_URL || vars.PRODUCTION_HEALTH_URL }}
          VERIFY_ENVIRONMENT: ${{ inputs.environment }}
          # A Coolify rollback rolls the container over asynchronously.
          VERIFY_WAIT_S: '180'
          COOLIFY_WEBHOOK: ${{ inputs.environment == 'staging' && secrets.COOLIFY_STAGING_WEBHOOK || secrets.COOLIFY_PRODUCTION_WEBHOOK }}
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            # Still leave a record: a run page with no rollback statement is
            # how "did the rollback actually land?" becomes a Slack thread.
            echo "::warning::Health URL variable not set — rollback not verified"
            {
              echo "### Rollback verification — ${VERIFY_ENVIRONMENT}"
              echo
              echo "**Restored build:** \`${{ inputs.target_tag }}\`"
              echo
              echo "| Field | Value |"
              echo "|-------|-------|"
              echo "| Result | ⚠️ not verified — no health URL is configured for this environment |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          bash scripts/verify-deployed-image-tag.sh --rollback "${{ inputs.target_tag }}" "$HEALTH_URL"

      - name: Notify Slack — Rollback Success
        if: success()
        uses: slackapi/slack-github-action@485a9d42d3a49605f4898a3e6526e5a02eab28e0 # v1.27.1
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-message: "🔄 *Rollback Complete*\n\nEnvironment: `${{ inputs.environment }}`\nTarget Tag: `${{ inputs.target_tag }}`\nTriggered by: ${{ github.actor }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Notify Slack — Rollback Failed
        if: failure()
        uses: slackapi/slack-github-action@485a9d42d3a49605f4898a3e6526e5a02eab28e0 # v1.27.1
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-message: "🚨 *Rollback Failed*\n\nEnvironment: `${{ inputs.environment }}`\nTarget Tag: `${{ inputs.target_tag }}`\nTriggered by: ${{ github.actor }}\nCheck logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
