name: Rollback Deployment

# Rolls back to a specific Docker image tag.
# The deployment method (Coolify webhook or SSH) mirrors cd.yml exactly.
# Both the staging and production environments require GitHub Environment approvals.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      target_tag:
        description: 'Docker image tag to rollback to (e.g. staging-abc1234 or a previous SHA)'
        required: true

permissions:
  contents: read
  # The verify step reads the GHCR package version list to confirm the
  # rollback target tag actually exists (packages/container/.../versions needs
  # packages: read; with contents-only the call 403s and the step silently
  # degrades to "attempting rollback anyway").
  packages: read

jobs:
  rollback:
    name: Rollback to ${{ inputs.target_tag }} on ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'staging' && 'https://staging.azeeboplus.com' || 'https://azeeboplus.com' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify target image exists in GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.target_tag }}"
          echo "🔍 Verifying tag: $TAG"
          if ! gh api "repos/${{ github.repository }}/packages/container/azeebo-all-in-one/versions" \
              --jq '.[].metadata.container.tags[]' 2>/dev/null | grep -qx "$TAG"; then
            echo "::warning::Tag $TAG not found in GHCR package list — attempting rollback anyway (tag may be in a different package)"
          else
            echo "✅ Tag $TAG confirmed in GHCR"
          fi

      - name: Rollback via Coolify (Staging)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
        if: inputs.environment == 'staging' && env.COOLIFY_WEBHOOK != ''
        run: |
          echo "🔄 Triggering Coolify staging rollback to ${{ inputs.target_tag }}..."
          curl -fsSL -X POST "$COOLIFY_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"tag\": \"${{ inputs.target_tag }}\"}"
          echo "✅ Coolify staging rollback triggered"

      - name: Rollback via Coolify (Production)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}
        if: inputs.environment == 'production' && env.COOLIFY_WEBHOOK != ''
        run: |
          echo "🔄 Triggering Coolify production rollback to ${{ inputs.target_tag }}..."
          curl -fsSL -X POST "$COOLIFY_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"tag\": \"${{ inputs.target_tag }}\"}"
          echo "✅ Coolify production rollback triggered"

      - name: Rollback via SSH (Fallback — Staging)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
          DEPLOY_SSH_KEY_SET: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        if: inputs.environment == 'staging' && env.COOLIFY_WEBHOOK == '' && env.DEPLOY_SSH_KEY_SET == 'true'
        uses: appleboy/ssh-action@029f5b4aeefc5ef18188244d3a88aaae867b0a8a # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "🔄 Rolling back staging to ghcr.io/${{ github.repository }}:${{ inputs.target_tag }}"
            docker pull ghcr.io/${{ github.repository }}:${{ inputs.target_tag }}
            docker stop azeebo-staging || true
            docker rm azeebo-staging || true
            docker run -d \
              --name azeebo-staging \
              -p 3013:3013 \
              -p 4000:4000 \
              -p 4014:4014 \
              -p 4016:4016 \
              --env-file /opt/azeebo/.env.staging \
              --restart unless-stopped \
              ghcr.io/${{ github.repository }}:${{ inputs.target_tag }}
            echo "✅ Staging rollback complete"

      - name: Rollback via SSH (Fallback — Production)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}
          DEPLOY_SSH_KEY_SET: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        if: inputs.environment == 'production' && env.COOLIFY_WEBHOOK == '' && env.DEPLOY_SSH_KEY_SET == 'true'
        uses: appleboy/ssh-action@029f5b4aeefc5ef18188244d3a88aaae867b0a8a # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "🔄 Rolling back production to ghcr.io/${{ github.repository }}:${{ inputs.target_tag }}"
            docker pull ghcr.io/${{ github.repository }}:${{ inputs.target_tag }}
            docker stop azeebo || true
            docker rm azeebo || true
            docker run -d \
              --name azeebo \
              -p 3013:3013 \
              -p 4000:4000 \
              -p 4014:4014 \
              -p 4016:4016 \
              --env-file /opt/azeebo/.env.production \
              --restart unless-stopped \
              ghcr.io/${{ github.repository }}:${{ inputs.target_tag }}
            echo "✅ Production rollback complete"

      - name: Verify rollback health
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            HEALTH_URL="${{ vars.STAGING_HEALTH_URL }}"
          else
            HEALTH_URL="${{ vars.PRODUCTION_HEALTH_URL }}"
          fi

          if [ -z "$HEALTH_URL" ]; then
            echo "::warning::Health URL variable not set — skipping rollback verification"
            exit 0
          fi

          echo "⏳ Waiting 30s for container restart..."
          sleep 30

          echo "🔍 Verifying health at ${HEALTH_URL}..."
          for i in {1..10}; do
            if curl -sf --max-time 10 "${HEALTH_URL}/health" > /dev/null 2>&1; then
              echo "✅ Health check passed after rollback"
              exit 0
            fi
            echo "  Attempt $i/10 — retrying in 10s..."
            sleep 10
          done
          echo "❌ Health check failed after rollback — manual investigation needed"
          exit 1

      - name: Notify Slack — Rollback Success
        if: success()
        uses: slackapi/slack-github-action@485a9d42d3a49605f4898a3e6526e5a02eab28e0 # v1.27.1
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-message: "🔄 *Rollback Complete*\n\nEnvironment: `${{ inputs.environment }}`\nTarget Tag: `${{ inputs.target_tag }}`\nTriggered by: ${{ github.actor }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Notify Slack — Rollback Failed
        if: failure()
        uses: slackapi/slack-github-action@485a9d42d3a49605f4898a3e6526e5a02eab28e0 # v1.27.1
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-message: "🚨 *Rollback Failed*\n\nEnvironment: `${{ inputs.environment }}`\nTarget Tag: `${{ inputs.target_tag }}`\nTriggered by: ${{ github.actor }}\nCheck logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

