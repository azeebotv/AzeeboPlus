name: Security Scan

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - main
      - develop
  pull_request:
    paths:
      - '**/package.json'
      - '**/pnpm-lock.yaml'
      - '**/Dockerfile'
      - '**/requirements.txt'
      - 'infra/**'
      - '.github/workflows/**'

env:
  DOCKER_REGISTRY: ghcr.io
  PNPM_VERSION: '9'
  NODE_VERSION: 20.x

jobs:
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    outputs:
      vulnerabilities-found: ${{ steps.scan.outputs.vulns_found }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        id: audit
        run: |
          npm audit --audit-level=high --json > audit-results.json || true
        continue-on-error: true

      - name: Parse audit results
        id: scan
        run: |
          if [ -f audit-results.json ]; then
            vulns=$(cat audit-results.json | jq '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical // 0')
            echo "vulns_found=$vulns" >> $GITHUB_OUTPUT
          else
            echo "vulns_found=0" >> $GITHUB_OUTPUT
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-regex: 'node_modules'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Check vulnerability threshold
        if: steps.scan.outputs.vulns_found > 0
        run: |
          echo "Found ${{ steps.scan.outputs.vulns_found }} high/critical vulnerabilities"
        continue-on-error: true

  secrets-scan:
    name: Secrets Detection Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          pip install trufflehog

      - name: Run TruffleHog
        run: |
          trufflehog git file://. --json --no-update > secrets-results.json || true

      - name: Parse secrets scan results
        id: parse
        run: |
          if [ -f secrets-results.json ] && [ -s secrets-results.json ]; then
            echo "secrets_found=true" >> $GITHUB_OUTPUT
            echo "Files with potential secrets:"
            cat secrets-results.json | jq -r '.SourceName' | sort -u
          else
            echo "secrets_found=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Fail on secrets found
        if: steps.parse.outputs.secrets_found == 'true'
        run: |
          echo "Potential secrets detected! Please review and remove them."
          cat secrets-results.json | jq '.'
          exit 1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-results
          path: secrets-results.json
          retention-days: 7

  docker-image-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read

    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - wallet-service
          - payment-service
          - content-service
          - media-service
          - notification-service
          - analytics-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: false
          load: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy scanner on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}:test'
          format: 'sarif'
          output: 'docker-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'

      - name: Upload Docker scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'docker-trivy-results.sarif'
        continue-on-error: true

  kubernetes-manifest-scan:
    name: Kubernetes Manifest Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if infra/k8s directory exists
        id: check_k8s_dir
        run: |
          if [ -d "infra/k8s" ]; then
            echo "k8s_dir_exists=true" >> $GITHUB_OUTPUT
          else
            echo "k8s_dir_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.13.0'
        if: steps.check_k8s_dir.outputs.k8s_dir_exists == 'true'

      - name: Install kubescape
        run: |
          curl -s https://raw.githubusercontent.com/kubescape/kubescape/master/install.sh | /bin/bash
        if: steps.check_k8s_dir.outputs.k8s_dir_exists == 'true'

      - name: Run kubescape scan
        run: |
          kubescape scan infra/k8s/ --format sarif --output kubescape-results.sarif --severity-threshold critical
        continue-on-error: true
        if: steps.check_k8s_dir.outputs.k8s_dir_exists == 'true'

      - name: Upload kubescape results
        if: always() && steps.check_k8s_dir.outputs.k8s_dir_exists == 'true' && hashFiles('kubescape-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'kubescape-results.sarif'
        continue-on-error: true

      - name: Check Kubernetes configurations
        run: |
          echo "Checking for common security issues in Kubernetes manifests..."

      - name: Check for hardcoded secrets in K8s
        run: |
          echo "Scanning for potential hardcoded secrets..."
          grep -r "password:" infra/k8s/ || echo "No hardcoded passwords found"
          grep -r "secretKeyRef" infra/k8s/ || echo "No inline secretKeyRef found"

      - name: Check for privileged containers
        run: |
          echo "Checking for privileged containers..."
          grep -r "privileged: true" infra/k8s/ || echo "No privileged containers found"

      - name: Check for root containers
        run: |
          echo "Checking for root user containers..."
          grep -r "runAsUser: 0" infra/k8s/ || echo "No root user containers found"

      - name: Check for hostPath volumes
        run: |
          echo "Checking for hostPath volumes..."
          grep -r "hostPath" infra/k8s/ || echo "No hostPath volumes found"

  codeql-scan:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          upload: false
        continue-on-error: true

  sast-scan:
    name: SAST Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep scan
        uses: semgrep/semgrep-action@v1
        with:
          config: 'auto'
          output-format: 'sarif'
          output-path: 'semgrep-results.sarif'
        continue-on-error: true

      - name: Upload Semgrep results to GitHub
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'semgrep-results.sarif'
        continue-on-error: true

      - name: Upload Semgrep results artifact
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.sarif
          retention-days: 7

  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, secrets-scan, docker-image-scan, kubernetes-manifest-scan, codeql-scan, sast-scan]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Dependency Scan" >> $GITHUB_STEP_SUMMARY
          echo "- Vulnerabilities found: ${{ needs.dependency-scan.outputs.vulnerabilities-found || 0 }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Secrets Scan" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets detected: ${{ needs.secrets-scan.outputs.secrets_found || false }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Docker Image Scan" >> $GITHUB_STEP_SUMMARY
          echo "- All services scanned" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Kubernetes Manifest Scan" >> $GITHUB_STEP_SUMMARY
          echo "- Scanned infra/k8s/ for security misconfigurations" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### CodeQL Scan" >> $GITHUB_STEP_SUMMARY
          echo "- Completed security analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### SAST Scan" >> $GITHUB_STEP_SUMMARY
          echo "- Completed Semgrep analysis" >> $GITHUB_STEP_SUMMARY

      - name: Set completion status
        id: completion-status
        run: |
          # Check critical jobs - skip those that are allowed to continue on error or don't exist
          FAILED=0
          
          # Check dependency scan
          if [[ "${{ needs.dependency-scan.result }}" != "success" ]]; then
            echo "❌ Dependency scan failed"
            FAILED=1
          fi
          
          # Check secrets scan
          if [[ "${{ needs.secrets-scan.result }}" != "success" ]]; then
            echo "❌ Secrets scan failed"
            FAILED=1
          fi
          
          # Exit with failure if any critical jobs failed
          if [[ $FAILED -ne 0 ]]; then
            echo "Security scan found critical issues that need attention"
            exit 1
          fi
          
          echo "✅ All critical security scans passed"
          exit 0