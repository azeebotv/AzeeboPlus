name: Security Scan

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b7178b1d3c6c0e6e0f7e2c6f8e7e2e7e7e7e7e7e # v2.4.0
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Run audit for each service
        run: |
          for service in services/*/; do
            echo "Auditing $service"
            cd "$service"
            pnpm audit --audit-level=high || true
            cd ../..
          done

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@bba33a88e0f2e0e8e66e4e2e0e3e4e5e6e7e8e9 # main
        with:
          project: 'azeebo-plus'
          path: '.'
          format: 'html'

  owasp-zap-scan:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    needs: dependency-audit
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: OWASP ZAP Scan
        uses: zaproxy/action-full-scan@75ee1686750ab1511a73b26b77a2aedd46806163 # v0.10.0
        with:
          target: 'https://api.azeeboplus.com'
          rules_file_name: 'infra/security/zap-config.yaml'
          docker_params: '-t 60'
          fail_action: true
          allow_issue_writing: true
          artifact_name: 'zap_report'

  docker-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    needs: dependency-audit
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build Docker image
        run: |
          docker build -t azeebo-api:latest -f services/api-gateway/Dockerfile .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@18168e2f77bb7557e0e73f7e67f8f04b43e4e433 # master
        with:
          image-ref: 'azeebo-api:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH,MEDIUM'
