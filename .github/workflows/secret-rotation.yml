name: Secret Rotation

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rotate secrets'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      force_rotation:
        description: 'Force rotation regardless of age'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  rotate-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Run secret rotation
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          SECRET_PREFIX: azeebo
          ROTATION_INTERVAL_DAYS: 90
          NOTIFICATION_EMAIL: ${{ secrets.SECURITY_EMAIL || 'security@azeeboplus.com' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
        run: |
          chmod +x ./scripts/secret-rotation.sh
          
          if [ "${{ github.event.inputs.force_rotation }}" = "true" ]; then
            echo "🔄 Force rotation enabled"
            sed -i 's/ROTATION_INTERVAL_DAYS="${ROTATION_INTERVAL_DAYS:-90}"/ROTATION_INTERVAL_DAYS=0/' ./scripts/secret-rotation.sh
          fi
          
          ./scripts/secret-rotation.sh

      - name: Verify rotated secrets
        run: |
          echo "🔍 Verifying rotated secrets..."
          
          SECRETS=$(aws secretsmanager list-secrets \
            --region "${{ secrets.AWS_REGION || 'us-east-1' }}" \
            --query "SecretList[?starts_with(Name, 'azeebo/')].Name" \
            --output text)
          
          for secret in $SECRETS; do
            echo "✅ Secret accessible: $secret"
            aws secretsmanager get-secret-value \
              --secret-id "$secret" \
              --region "${{ secrets.AWS_REGION || 'us-east-1' }}" \
              --query SecretString \
              --output text > /dev/null
          done

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{
              \"text\": \"🚨 Secret Rotation Failed\nEnvironment: ${{ github.event.inputs.environment || 'production' }}\nWorkflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"
            }"
