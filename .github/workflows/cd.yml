name: CD Pipeline - Deploy to Kubernetes

on:
  push:
    tags:
      - 'v*'
      - '*-staging'
      - '*-production'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      tag:
        description: 'Docker tag to deploy'
        required: true
        default: 'latest'

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            azeebo/auth-service
            azeebo/api-gateway
            azeebo/queue-service
            azeebo/lifestyle-service
            azeebo/vertical-service
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push auth-service
        uses: docker/build-push-action@v6
        with:
          context: ./services/auth-service
          push: true
          tags: azeebo/auth-service:${{ github.event.inputs.tag || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push api-gateway
        uses: docker/build-push-action@v6
        with:
          context: ./services/api-gateway
          push: true
          tags: azeebo/api-gateway:${{ github.event.inputs.tag || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push queue-service
        uses: docker/build-push-action@v6
        with:
          context: ./services/queue-service
          push: true
          tags: azeebo/queue-service:${{ github.event.inputs.tag || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push lifestyle-service
        uses: docker/build-push-action@v6
        with:
          context: ./services/lifestyle-service
          push: true
          tags: azeebo/lifestyle-service:${{ github.event.inputs.tag || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push vertical-service
        uses: docker/build-push-action@v6
        with:
          context: ./services/vertical-service
          push: true
          tags: azeebo/vertical-service:${{ github.event.inputs.tag || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ inputs.environment || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${{ github.event.inputs.tag || github.sha }}" >> $GITHUB_ENV
          echo "ENV=${{ inputs.environment || 'staging' }}" >> $GITHUB_ENV

      - name: Update Kubernetes manifests
        run: |
          cd infra/k8s
          for file in *.yaml; do
            if grep -q "DOCKER_IMAGE:TAG" "$file"; then
              sed -i "s|DOCKER_IMAGE:TAG|azeebo/$file:-service:${{ env.IMAGE_TAG }}|g" "$file"
            fi
          done

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k infra/k8s/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/auth-service -n azeebo --timeout=5m
          kubectl rollout status deployment/api-gateway -n azeebo --timeout=5m
          kubectl rollout status deployment/queue-service -n azeebo --timeout=5m
          kubectl rollout status deployment/web-app -n azeebo --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get pods -n azeebo
          kubectl get services -n azeebo