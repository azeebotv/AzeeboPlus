name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '22.16.0'
  PNPM_VERSION: '10.33.2'

jobs:
  # CD approval gate: branch protection only covers PRs, so push-to-main
  # deploys get their own gate — this job waits for the push-time CI checks
  # (CI: Build / E2E Tests / Security Scan; Dockerized E2E: Actionlint /
  # Dockerized e2e suites) on this commit and fails the deployment if any of
  # them failed or is missing. Manual (workflow_dispatch) deploys skip the
  # gate — they are already gated by the environment approval.
  verify-ci-checks:
    name: Verify Required Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'push'
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Wait for required checks on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REQUIRED=(
            "Build"
            "E2E Tests"
            "Security Scan"
            "Actionlint (workflow syntax)"
            "Dockerized e2e suites"
          )
          SHA="${{ github.sha }}"
          DEADLINE=$((SECONDS + 1200))
          while [ $SECONDS -lt $DEADLINE ]; do
            gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | {name, status, conclusion}]' > /tmp/checks.json
            ALL_DONE=1
            for name in "${REQUIRED[@]}"; do
              STATUS=$(jq -r --arg n "$name" '.[] | select(.name == $n) | .status' /tmp/checks.json)
              if [ -z "$STATUS" ]; then
                echo "⏳ check \"$name\" not started yet"
                ALL_DONE=0
                continue
              fi
              if [ "$STATUS" != "completed" ]; then
                echo "⏳ check \"$name\" is $STATUS"
                ALL_DONE=0
                continue
              fi
              CONCLUSION=$(jq -r --arg n "$name" '.[] | select(.name == $n) | (.conclusion // "none")' /tmp/checks.json)
              if [ "$CONCLUSION" != "success" ]; then
                echo "❌ Required check \"$name\" finished with conclusion: $CONCLUSION"
                cat /tmp/checks.json
                exit 1
              fi
            done
            if [ $ALL_DONE -eq 1 ]; then
              echo "✅ All required checks passed for $SHA"
              exit 0
            fi
            echo "⏳ Waiting for checks to complete… $((DEADLINE - SECONDS))s left"
            sleep 20
          done
          echo "❌ Timed out waiting for required checks on $SHA"
          cat /tmp/checks.json
          exit 1

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify-ci-checks]
    if: (github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging') && (needs.verify-ci-checks.result == 'success' || needs.verify-ci-checks.result == 'skipped')
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.all-in-one
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://staging.azeeboplus.com' }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag ghcr.io/${{ github.repository }}:staging-${{ github.sha }} ghcr.io/${{ github.repository }}:staging
          docker push ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:staging
          # Also push :latest so the production SSH fallback has a stable tag to pull
          docker tag ghcr.io/${{ github.repository }}:staging-${{ github.sha }} ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest

      # secrets.* is FORBIDDEN in if: conditionals (GitHub rejects the whole
      # workflow file — zero jobs, run named by file path). Evaluate into env
      # instead; env context is allowed in step-level if:.
      - name: Deploy to Coolify (Staging)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
        if: env.COOLIFY_WEBHOOK != ''
        run: |
          curl -X POST "$COOLIFY_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"tag\": \"staging-${{ github.sha }}\", \"compose_file\": \"docker-compose.all-in-one.yml\"}"

      - name: Deploy via SSH (Fallback)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
          DEPLOY_SSH_KEY_SET: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        if: env.COOLIFY_WEBHOOK == '' && env.DEPLOY_SSH_KEY_SET == 'true'
        # Pinned to v1.7.0 SHA — update intentionally after reviewing release notes
        uses: appleboy/ssh-action@029f5b4aeefc5ef18188244d3a88aaae867b0a8a # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/azeebo
            docker pull ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
            docker stop azeebo-staging || true
            docker rm azeebo-staging || true
            docker run -d \
              --name azeebo-staging \
              -p 3013:3013 \
              -p 4000:4000 \
              -p 4014:4014 \
              -p 4016:4016 \
              --env-file /opt/azeebo/.env.staging \
              --restart unless-stopped \
              ghcr.io/${{ github.repository }}:staging-${{ github.sha }}

  health-check-staging:
    name: Health Check (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-staging]
    steps:
      - name: Validate staging URL variables are configured
        run: |
          if [ -z "${{ vars.STAGING_HEALTH_URL }}" ]; then
            echo "::error::STAGING_HEALTH_URL GitHub variable is not set."
            echo "::error::Set it to your staging server URL (e.g. https://staging.azeeboplus.com)"
            echo "::error::Without it, health checks would silently test localhost on the runner."
            exit 1
          fi
          if [ -z "${{ vars.STAGING_BASE_URL }}" ]; then
            echo "::error::STAGING_BASE_URL GitHub variable is not set."
            exit 1
          fi

      - name: Wait for services to start
        run: sleep 60

      - name: Check health endpoints
        run: |
          HEALTH_URL="${{ vars.STAGING_HEALTH_URL }}"
          for i in {1..10}; do
            if curl -sf "${HEALTH_URL}/health" > /dev/null 2>&1; then
              echo "✅ API Gateway healthy"
              break
            fi
            echo "Waiting for API Gateway... ($i/10)"
            sleep 10
          done

      - name: Verify all services
        run: |
          BASE_URL="${{ vars.STAGING_BASE_URL }}"
          SERVICES=(
            "3013:API Gateway"
            "4000:Web App"
            "4014:Creator Portal"
            "4016:Admin Panel"
          )
          FAILED=0
          for svc in "${SERVICES[@]}"; do
            PORT="${svc%%:*}"
            NAME="${svc##*:}"
            if curl -sf "${BASE_URL}:${PORT}/health" > /dev/null 2>&1; then
              echo "✅ ${NAME} healthy on port ${PORT}"
            else
              echo "❌ ${NAME} unhealthy on port ${PORT}"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: API smoke tests
        run: |
          HEALTH_URL="${{ vars.STAGING_HEALTH_URL || 'http://localhost:3013' }}"
          ENDPOINTS=(
            "/api/v1/auth/health"
            "/api/v1/users/health"
            "/api/v1/wallet/health"
            "/api/v1/content/health"
            "/api/v1/payments/health"
            "/api/v1/search/health"
            "/api/v1/media/health"
            "/api/v1/notifications/health"
            "/api/v1/rewards/health"
            "/api/v1/analytics/health"
            "/api/v1/recommendation/health"
            "/api/v1/engagement/health"
            "/api/v1/messaging/health"
            "/api/v1/referrals/health"
            "/api/v1/subscriptions/health"
            "/api/v1/moderation/health"
            "/api/v1/support/health"
            "/api/v1/queue/health"
            "/api/v1/creator/health"
            "/api/v1/creator/live-events/health"
            "/api/v1/creator/reality-shows/health"
            "/api/v1/creator/movies/health"
            "/api/v1/creator/comedy/health"
            "/api/v1/creator/games/health"
            "/api/v1/creator/sports/health"
            "/api/v1/creator/lifestyle/health"
            "/api/v1/creator/vertical/health"
          )
          FAILED=0
          for ep in "${ENDPOINTS[@]}"; do
            OK=0
            for attempt in 1 2 3; do
              if curl -sf --max-time 10 "${HEALTH_URL}${ep}" > /dev/null 2>&1; then
                echo "✅ ${ep} OK (attempt ${attempt})"
                OK=1
                break
              fi
              echo "⏳ ${ep} retry ${attempt}/3 ..."
              sleep 10
            done
            if [ "$OK" -eq 0 ]; then
              echo "❌ ${ep} FAILED after 3 attempts"
              FAILED=1
            fi
          done
          exit $FAILED

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
    environment: production
    needs: [health-check-staging]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Coolify (Production)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}
        if: env.COOLIFY_WEBHOOK != ''
        run: |
          curl -X POST "$COOLIFY_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"tag\": \"${{ github.sha }}\"}"

      - name: Deploy via SSH (Fallback)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}
          DEPLOY_SSH_KEY_SET: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        if: env.COOLIFY_WEBHOOK == '' && env.DEPLOY_SSH_KEY_SET == 'true'
        # Pinned to v1.2.0 SHA — update intentionally after reviewing release notes
        uses: appleboy/ssh-action@029f5b4aeefc5ef18188244d3a88aaae867b0a8a # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/azeebo
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop azeebo || true
            docker rm azeebo || true
            docker run -d \
              --name azeebo \
              -p 3013:3013 \
              -p 4000:4000 \
              -p 4014:4014 \
              -p 4016:4016 \
              --env-file /opt/azeebo/.env.production \
              --restart unless-stopped \
              ghcr.io/${{ github.repository }}:latest


  health-check-production:
    name: Health Check (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-production]
    steps:
      - name: Validate production URL variables are configured
        run: |
          if [ -z "${{ vars.PRODUCTION_HEALTH_URL }}" ]; then
            echo "::error::PRODUCTION_HEALTH_URL GitHub variable is not set."
            echo "::error::Set it to your production URL (e.g. https://app.azeeboplus.com)"
            exit 1
          fi
          if [ -z "${{ vars.PRODUCTION_BASE_URL }}" ]; then
            echo "::error::PRODUCTION_BASE_URL GitHub variable is not set."
            exit 1
          fi

      - name: Wait for services to start
        run: sleep 90

      - name: Check health endpoints
        run: |
          HEALTH_URL="${{ vars.PRODUCTION_HEALTH_URL }}"
          for i in {1..15}; do
            if curl -sf "${HEALTH_URL}/health" > /dev/null 2>&1; then
              echo "✅ API Gateway healthy"
              break
            fi
            echo "Waiting for API Gateway... ($i/15)"
            sleep 10
          done

      - name: Verify all services
        run: |
          BASE_URL="${{ vars.PRODUCTION_BASE_URL }}"
          SERVICES=(
            "3013:API Gateway"
            "4000:Web App"
            "4014:Creator Portal"
            "4016:Admin Panel"
          )
          FAILED=0
          for svc in "${SERVICES[@]}"; do
            PORT="${svc%%:*}"
            NAME="${svc##*:}"
            if curl -sf "${BASE_URL}:${PORT}/health" > /dev/null 2>&1; then
              echo "✅ ${NAME} healthy on port ${PORT}"
            else
              echo "❌ ${NAME} unhealthy on port ${PORT}"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: API smoke tests
        run: |
          HEALTH_URL="${{ vars.PRODUCTION_HEALTH_URL }}"
          ENDPOINTS=(
            "/api/v1/auth/health"
            "/api/v1/users/health"
            "/api/v1/wallet/health"
            "/api/v1/content/health"
            "/api/v1/payments/health"
            "/api/v1/search/health"
            "/api/v1/media/health"
            "/api/v1/notifications/health"
            "/api/v1/rewards/health"
            "/api/v1/analytics/health"
            "/api/v1/recommendation/health"
            "/api/v1/engagement/health"
            "/api/v1/messaging/health"
            "/api/v1/referrals/health"
            "/api/v1/subscriptions/health"
            "/api/v1/moderation/health"
            "/api/v1/support/health"
            "/api/v1/queue/health"
            "/api/v1/creator/health"
            "/api/v1/creator/live-events/health"
            "/api/v1/creator/reality-shows/health"
            "/api/v1/creator/movies/health"
            "/api/v1/creator/comedy/health"
            "/api/v1/creator/games/health"
            "/api/v1/creator/sports/health"
            "/api/v1/creator/lifestyle/health"
            "/api/v1/creator/vertical/health"
          )
          FAILED=0
          for ep in "${ENDPOINTS[@]}"; do
            OK=0
            for attempt in 1 2 3; do
              if curl -sf --max-time 10 "${HEALTH_URL}${ep}" > /dev/null 2>&1; then
                echo "✅ ${ep} OK (attempt ${attempt})"
                OK=1
                break
              fi
              echo "⏳ ${ep} retry ${attempt}/3 ..."
              sleep 10
            done
            if [ "$OK" -eq 0 ]; then
              echo "❌ ${ep} FAILED after 3 attempts"
              FAILED=1
            fi
          done
          exit $FAILED
