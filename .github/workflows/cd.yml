name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '22.16.0'
  PNPM_VERSION: '10.33.2'

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.all-in-one
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://staging.azeeboplus.com' }}

      - name: Push to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag ghcr.io/${{ github.repository }}:staging-${{ github.sha }} ghcr.io/${{ github.repository }}:staging
          docker push ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:staging

      - name: Deploy to Coolify (Staging)
        if: ${{ secrets.COOLIFY_STAGING_WEBHOOK != '' }}
        run: |
          curl -X POST "${{ secrets.COOLIFY_STAGING_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\": \"staging-${{ github.sha }}\", \"compose_file\": \"docker-compose.all-in-one.yml\"}"

      - name: Deploy via SSH (Fallback)
        if: ${{ secrets.COOLIFY_STAGING_WEBHOOK == '' && secrets.DEPLOY_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/azeebo
            docker pull ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
            docker stop azeebo-staging || true
            docker rm azeebo-staging || true
            docker run -d \
              --name azeebo-staging \
              -p 3013:3013 \
              -p 4000:4000 \
              -p 4014:4014 \
              -p 4016:4016 \
              --env-file /opt/azeebo/.env.staging \
              --restart unless-stopped \
              ghcr.io/${{ github.repository }}:staging-${{ github.sha }}

  health-check-staging:
    name: Health Check (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-staging]
    steps:
      - name: Wait for services to start
        run: sleep 60

      - name: Check health endpoints
        run: |
          HEALTH_URL="${{ vars.STAGING_HEALTH_URL || 'http://localhost:3013' }}"
          for i in {1..10}; do
            if curl -sf "${HEALTH_URL}/health" > /dev/null 2>&1; then
              echo "✅ API Gateway healthy"
              break
            fi
            echo "Waiting for API Gateway... ($i/10)"
            sleep 10
          done

      - name: Verify all services
        run: |
          BASE_URL="${{ vars.STAGING_BASE_URL || 'http://localhost' }}"
          SERVICES=(
            "3013:API Gateway"
            "4000:Web App"
            "4014:Creator Portal"
            "4016:Admin Panel"
          )
          FAILED=0
          for svc in "${SERVICES[@]}"; do
            PORT="${svc%%:*}"
            NAME="${svc##*:}"
            if curl -sf "${BASE_URL}:${PORT}/health" > /dev/null 2>&1; then
              echo "✅ ${NAME} healthy on port ${PORT}"
            else
              echo "❌ ${NAME} unhealthy on port ${PORT}"
              FAILED=1
            fi
          done
          exit $FAILED

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.environment == 'production'
    environment: production
    needs: [health-check-staging]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Coolify (Production)
        if: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK != '' }}
        run: |
          curl -X POST "${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\": \"${{ github.sha }}\"}"

      - name: Deploy via SSH (Fallback)
        if: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK == '' && secrets.DEPLOY_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/azeebo
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop azeebo || true
            docker rm azeebo || true
            docker run -d \
              --name azeebo \
              -p 3013:3013 \
              -p 4000:4000 \
              -p 4014:4014 \
              -p 4016:4016 \
              --env-file /opt/azeebo/.env.production \
              --restart unless-stopped \
              ghcr.io/${{ github.repository }}:latest

  health-check-production:
    name: Health Check (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-production]
    steps:
      - name: Wait for services to start
        run: sleep 90

      - name: Check health endpoints
        run: |
          HEALTH_URL="${{ vars.PRODUCTION_HEALTH_URL || 'https://app.azeeboplus.com' }}"
          for i in {1..15}; do
            if curl -sf "${HEALTH_URL}/health" > /dev/null 2>&1; then
              echo "✅ API Gateway healthy"
              break
            fi
            echo "Waiting for API Gateway... ($i/15)"
            sleep 10
          done

      - name: Verify all services
        run: |
          BASE_URL="${{ vars.PRODUCTION_BASE_URL || 'https://app.azeeboplus.com' }}"
          SERVICES=(
            "3013:API Gateway"
            "4000:Web App"
            "4014:Creator Portal"
            "4016:Admin Panel"
          )
          FAILED=0
          for svc in "${SERVICES[@]}"; do
            PORT="${svc%%:*}"
            NAME="${svc##*:}"
            if curl -sf "${BASE_URL}:${PORT}/health" > /dev/null 2>&1; then
              echo "✅ ${NAME} healthy on port ${PORT}"
            else
              echo "❌ ${NAME} unhealthy on port ${PORT}"
              FAILED=1
            fi
          done
          exit $FAILED
