name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '22.16.0'
  PNPM_VERSION: '10.33.2'

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prisma:generate --if-present
      - run: pnpm run build
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Build and push Docker images
          if [ -f docker-bake.hcl ]; then
            docker buildx bake -f docker-bake.hcl --set "*.tags=ghcr.io/${{ github.repository }}:staging-${{ github.sha }}" --load
          fi
          # Apply K8s manifests for staging
          if [ -d infra/k8s/overlays/dev ]; then
            kubectl apply -k infra/k8s/overlays/dev
          fi

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.environment == 'production'
    environment: production
    needs: [deploy-staging]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prisma:generate --if-present
      - run: pnpm run build
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Build and push Docker images
          if [ -f docker-bake.hcl ]; then
            docker buildx bake -f docker-bake.hcl --set "*.tags=ghcr.io/${{ github.repository }}:prod-${{ github.sha }}" --load
          fi
          # Apply K8s manifests for production
          if [ -d infra/k8s/overlays/production ]; then
            kubectl apply -k infra/k8s/overlays/production
          fi

  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-staging]
    steps:
      - uses: actions/checkout@v4
      - name: Run health checks
        run: |
          echo "Running post-deploy health checks..."
          # Wait for rollout to complete — fail if it doesn't
          kubectl rollout status deployment/api-gateway -n default --timeout=120s
          # Check health endpoints — fail if any is down
          for port in 3013; do
            if curl -sf --max-time 10 "http://localhost:${port}/health" > /dev/null 2>&1; then
              echo "Health check passed on port ${port}"
            else
              echo "FATAL: Health check failed on port ${port}"
              exit 1
            fi
          done
