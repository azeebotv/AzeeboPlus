name: CI Pipeline - Full Gates

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'
  PNPM_VERSION: '9'

jobs:
  install-and-prisma:
    name: Install & Generate Prisma Clients
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm -r prisma:generate

      - name: Upload Prisma clients cache
        uses: actions/upload-artifact@v4
        with:
          name: prisma-clients
          path: |
            **/node_modules/.prisma/**
            **/node_modules/@prisma/**
          retention-days: 1

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    needs: install-and-prisma
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma clients cache
        uses: actions/download-artifact@v4
        with:
          name: prisma-clients

      - name: Lint code
        run: pnpm run lint

      - name: Type check all packages
        run: pnpm run typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: install-and-prisma
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: azeebo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma clients cache
        uses: actions/download-artifact@v4
        with:
          name: prisma-clients

      - name: Run migrations
        run: |
          pnpm -r --filter='./services/**' exec prisma migrate deploy || true

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run integration tests
        run: pnpm run test:integration
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/azeebo_test
          REDIS_URL: redis://localhost:6379

  build:
    name: Build All Packages
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma clients cache
        uses: actions/download-artifact@v4
        with:
          name: prisma-clients

      - name: Build shared packages
        run: pnpm --filter='@azeebo/shared-types' --filter='@azeebo/logger' --filter='@azeebo/error-handling' --filter='@azeebo/security' --filter='@azeebo/utils' build

      - name: Build all packages
        run: pnpm run build

  docker-smoke-tests:
    name: Docker Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - wallet-service
          - payment-service
          - api-gateway
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          load: true
          tags: azeebo/${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke test container
        run: |
          docker run --rm --name smoke-test-${{ matrix.service }} \
            --env DATABASE_URL="postgresql://test:test@host.docker.internal:5432/test" \
            --env REDIS_URL="redis://host.docker.internal:6379" \
            --env JWT_SECRET="test-secret" \
            --env NODE_ENV="test" \
            azeebo/${{ matrix.service }}:test \
            sh -c "echo 'Container started successfully' && exit 0" || exit 1

  artifact-check:
    name: Check for Committed Generated Artifacts
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for committed artifacts
        run: |
          if git diff --name-only | grep -E "(node_modules|dist|\.next|src/generated/prisma|prisma/client)" > /dev/null; then
            echo "Error: Generated artifacts found in git diff"
            git diff --name-only | grep -E "(node_modules|dist|\.next|src/generated/prisma|prisma/client)"
            exit 1
          fi
          echo "No committed generated artifacts found"

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: install-and-prisma
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=high

      - name: Check for secrets in code
        run: |
          echo "Checking for potential secrets..."
          if grep -r -E "(password|secret|api_key|apikey|token|private_key)" --include="*.ts" --include="*.js" --include="*.yaml" --include="*.yml" . 2>/dev/null | grep -v "node_modules" | grep -v ".git" | grep -v "*.test.ts" | grep -v "*.spec.ts" | grep -v "example" | grep -v "test" | grep -v "# " | head -20; then
            echo "Potential secrets found - review above output"
          fi

  migration-check:
    name: Database Migration Check
    runs-on: ubuntu-latest
    needs: install-and-prisma
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: azeebo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma clients cache
        uses: actions/download-artifact@v4
        with:
          name: prisma-clients

      - name: Validate Prisma schemas
        run: |
          for service in services/*/prisma/schema.prisma; do
            echo "Validating $service"
            npx prisma validate --schema="$service" || exit 1
          done

      - name: Check migration files exist
        run: |
          for service in services/*/prisma/migrations; do
            if [ ! -d "$service" ]; then
              echo "No migrations found in $service"
              exit 1
            fi
          done
          echo "All services have migrations"

  web-build:
    name: Web App Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma clients cache
        uses: actions/download-artifact@v4
        with:
          name: prisma-clients

      - name: Build web app
        run: pnpm --filter='@azeebo/web' build

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 1

  mobile-build:
    name: Mobile App Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma clients cache
        uses: actions/download-artifact@v4
        with:
          name: prisma-clients

      - name: Check mobile environment
        run: cat apps/mobile/EXPO_ENVIRONMENT.md

      - name: Validate EAS config
        run: |
          if [ -f apps/mobile/eas.json ]; then
            echo "Validating EAS config..."
          fi

  all-gates-passed:
    name: All CI Gates Passed
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - build
      - docker-smoke-tests
      - artifact-check
      - security-scan
      - migration-check
      - web-build
      - mobile-build
    steps:
      - name: CI Complete
        run: echo "All CI gates passed successfully"