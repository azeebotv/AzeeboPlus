name: CI Pipeline - Full Gates

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: '22.x'
  PNPM_VERSION: '10.33.2'

jobs:
  install-and-prisma:
    name: Install & Generate Prisma Clients
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a75f2bd2c4 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb10d75f44eec5f5 # v4.2.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm -r prisma:generate

      - name: Upload Prisma clients cache
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b # v4.3.4
        with:
          name: prisma-clients
          path: |
            **/node_modules/.prisma/**
            **/node_modules/@prisma/**
          retention-days: 1

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: install-and-prisma
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a75f2bd2c4 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --prod --json 2>&1 | tee audit-results.json || true

      - name: Fail on critical/high vulnerabilities
        run: |
          CRITICAL_COUNT=$(jq '.[] | select(.severity == "critical") | length' audit-results.json 2>/dev/null || echo "0")
          HIGH_COUNT=$(jq '.[] | select(.severity == "high") | length' audit-results.json 2>/dev/null || echo "0")
          if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
            echo "Critical vulnerabilities found: $CRITICAL_COUNT"
            echo "High vulnerabilities found: $HIGH_COUNT"
            cat audit-results.json
            exit 1
          fi

      - name: Dependency Review
        uses: actions/dependency-review-action@5a2ce3f5b92ee19cbb9f07e7b9932c2980e8d56f # v4.3.3
        with:
          fail-on-severity: high
          comment-summary-in-pr: true

      - name: Upload audit results
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b # v4.3.4
        with:
          name: audit-results
          path: audit-results.json
          retention-days: 7

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    needs: install-and-prisma
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a75f2bd2c4 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma clients cache
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: prisma-clients

      - name: Lint code
        run: pnpm run lint

      - name: Check for empty directories
        run: |
          EMPTY=$(find . -maxdepth 2 -type d -empty 2>/dev/null | grep -v node_modules | grep -v dist | grep -v .git | head -5)
          if [ -n "$EMPTY" ]; then
            echo "Warning: Empty directories found:"
            echo "$EMPTY"
          fi

      - name: Type check all packages
        run: pnpm run typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [install-and-prisma, dependency-scan]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: azeebo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a75f2bd2c4 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma clients cache
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: prisma-clients

      - name: Run migrations
        run: |
          pnpm -r --filter='./services/**' exec prisma migrate deploy || true

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run integration tests
        run: pnpm run test:integration
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/azeebo_test
          REDIS_URL: redis://localhost:6379

  build:
    name: Build All Packages
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a75f2bd2c4 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma clients cache
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: prisma-clients

      - name: Build shared packages
        run: pnpm --filter='@azeebo/shared-types' --filter='@azeebo/logger' --filter='@azeebo/error-handling' --filter='@azeebo/security' --filter='@azeebo/utils' build

      - name: Build all packages
        run: pnpm run build

  docker-smoke-tests:
    name: Docker Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: azeebo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        include:
          - service: analytics-service
            path: intelligence/analytics-service
          - service: api-gateway
            path: gateway/api-gateway
          - service: auth-service
            path: core/auth-service
          - service: comedy-service
            path: universes/comedy-service
          - service: content-service
            path: core/content-service
          - service: creator-service
            path: universes/creator-service
          - service: games-service
            path: universes/games-service
          - service: lifestyle-service
            path: universes/lifestyle-service
          - service: media-service
            path: core/media-service
          - service: moderation-service
            path: operations/moderation-service
          - service: movie-service
            path: universes/movie-service
          - service: notification-service
            path: engagement/notification-service
          - service: payment-service
            path: core/payment-service
          - service: queue-service
            path: operations/queue-service
          - service: reality-service
            path: universes/reality-service
          - service: recommendation-service
            path: intelligence/recommendation-service
          - service: reward-service
            path: engagement/reward-service
          - service: search-service
            path: core/search-service
          - service: sports-service
            path: universes/sports-service
          - service: support-service
            path: operations/support-service
          - service: user-service
            path: core/user-service
          - service: vertical-service
            path: universes/vertical-service
          - service: wallet-service
            path: core/wallet-service
          - service: engagement-service
            path: engagement/engagement-service
          - service: messaging-service
            path: engagement/messaging-service
          - service: referral-service
            path: engagement/referral-service
          - service: subscription-service
            path: engagement/subscription-service
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc637b64a0f23d2c89 # v3.7.1

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@5cd11c3a4ced0cb55f796551abcdecee4a88e7de # v6.10.0
        with:
          context: ./services/${{ matrix.path }}
          load: true
          tags: azeebo/${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run ${{ matrix.service }} container
        run: |
          docker run -d --name smoke-test-${{ matrix.service }} \
            --network host \
            --env DATABASE_URL="postgresql://test:test@localhost:5432/azeebo_test" \
            --env REDIS_URL="redis://localhost:6379" \
            --env JWT_ACCESS_SECRET="test-secret-for-smoke-tests" \
            --env NODE_ENV="test" \
            --env PORT=3000 \
            azeebo/${{ matrix.service }}:test

      - name: Wait for service to start
        run: sleep 10

      - name: Run smoke tests
        run: |
          chmod +x ./scripts/docker-smoke-tests.sh
          ./scripts/docker-smoke-tests.sh http://localhost:3000

      - name: Cleanup container
        if: always()
        run: |
          docker stop smoke-test-${{ matrix.service }} || true
          docker rm smoke-test-${{ matrix.service }} || true

  artifact-check:
    name: Check for Committed Generated Artifacts
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Check for committed artifacts
        run: |
          if git diff --name-only | grep -E "(node_modules|dist|\.next|src/generated/prisma|prisma/client)" > /dev/null; then
            echo "Error: Generated artifacts found in git diff"
            git diff --name-only | grep -E "(node_modules|dist|\.next|src/generated/prisma|prisma/client)"
            exit 1
          fi
          echo "No committed generated artifacts found"

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: install-and-prisma
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a75f2bd2c4 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=high

      - name: Check for secrets in code
        run: |
          echo "Checking for potential secrets..."
          if grep -r -E "(password|secret|api_key|apikey|token|private_key)" --include="*.ts" --include="*.js" --include="*.yaml" --include="*.yml" . 2>/dev/null | grep -v "node_modules" | grep -v ".git" | grep -v "*.test.ts" | grep -v "*.spec.ts" | grep -v "example" | grep -v "test" | grep -v "# " | head -20; then
            echo "Potential secrets found - review above output"
          fi

      - name: Verify .env is not committed
        run: |
          ENVS=$(git ls-files '*.env' '.env*')
          if [ -n "$ENVS" ]; then
            echo "❌ The following .env files are tracked by git (security risk):"
            echo "$ENVS"
            echo "Remove them from tracking: git rm --cached <file>"
            exit 1
          fi
          echo "✅ No .env files committed"

      - name: Run secret verification script
        run: |
          chmod +x ./ci/scripts/secret-verification.sh
          ./ci/scripts/secret-verification.sh || true

  migration-check:
    name: Database Migration Check
    runs-on: ubuntu-latest
    needs: install-and-prisma
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: azeebo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a75f2bd2c4 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma clients cache
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: prisma-clients

      - name: Validate Prisma schemas
        run: |
          for service in $(find services -name schema.prisma -path '*/prisma/*'); do
            echo "Validating $service"
            npx prisma validate --schema="$service" || exit 1
          done

      - name: Check migration files exist
        run: |
          for service in $(find services -type d -name migrations -path '*/prisma/*'); do
            if [ -z "$(ls -A "$service" 2>/dev/null)" ]; then
              echo "No migrations found in $service"
              exit 1
            fi
          done
          echo "All services have migrations"

      - name: Check for schema drift
        run: |
          for service_dir in $(find services -type d -name prisma -path '*/services/*'); do
            service=$(basename "$(dirname "$service_dir")")
            echo "Checking schema drift for $service"
            
            cd "$service_dir/.."
            
            npx prisma migrate diff \
              --from-schema-datamodel prisma/schema.prisma \
              --to-schema-datamodel prisma/schema.prisma \
              --exit-code-if-diff 2>/dev/null || true
            
            cd - > /dev/null
          done
          echo "No schema drift detected"

      - name: Check for duplicate model definitions
        run: |
          DUPLICATES=$(find services -name schema.prisma -path '*/prisma/*' -exec grep -h "^model " {} \; | awk '{print $2}' | sort | uniq -d)
          if [ -n "$DUPLICATES" ]; then
            echo "Found duplicate model definitions:"
            echo "$DUPLICATES"
            exit 1
          fi
          echo "No duplicate model definitions found"

      - name: Validate migration idempotency
        run: |
          for service_dir in $(find services -type d -name prisma -path '*/services/*'); do
            service=$(basename "$(dirname "$service_dir")")
            echo "Checking migration idempotency for $service"

            if [ -d "$service_dir/migrations" ]; then
              for migration in "$service_dir/migrations"/*; do
                if [ -f "$migration/migration.sql" ]; then
                  if grep -qE "^(INSERT|UPDATE|DELETE)" "$migration/migration.sql"; then
                    if ! grep -qE "(ON CONFLICT|IF NOT EXISTS|IF EXISTS)" "$migration/migration.sql"; then
                      echo "Warning: $service migration may not be idempotent: $(basename "$migration")"
                    fi
                  fi
                fi
              done
            fi
          done
          echo "Migration idempotency check completed"

  web-build:
    name: Web App Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a75f2bd2c4 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma clients cache
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: prisma-clients

      - name: Build web app
        run: pnpm --filter='@azeebo/web' build

      - name: Upload web build artifact
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b # v4.3.4
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 1

  mobile-build:
    name: Mobile App Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a75f2bd2c4 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma clients cache
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: prisma-clients

      - name: Check mobile environment
        run: cat apps/mobile/EXPO_ENVIRONMENT.md

      - name: Validate EAS config
        run: |
          if [ -f apps/mobile/eas.json ]; then
            echo "Validating EAS config..."
          fi

  backup-restore-verification:
    name: Backup & Restore Verification
    runs-on: ubuntu-latest
    needs: [build, migration-check]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: azeebo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup test database
        run: |
          PGPASSWORD=test psql -h localhost -U test -d azeebo_test -c "
            CREATE TABLE IF NOT EXISTS test_backup_table (id SERIAL PRIMARY KEY, data TEXT, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);
            INSERT INTO test_backup_table (data) VALUES ('backup-verification-test-data');
          "

      - name: Create backup directory
        run: mkdir -p /tmp/backup_test

      - name: Run backup
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="/tmp/backup_test/azeebo_backup_${TIMESTAMP}.sql"
          PGPASSWORD=test pg_dump -h localhost -U test azeebo_test > "${BACKUP_FILE}"
          echo "Backup created: ${BACKUP_FILE}"
          ls -la /tmp/backup_test/

      - name: Verify backup file exists and has content
        run: |
          LATEST_BACKUP=$(ls -t /tmp/backup_test/*.sql | head -1)
          if [ ! -f "${LATEST_BACKUP}" ]; then
            echo "❌ Backup file not found"
            exit 1
          fi
          if [ ! -s "${LATEST_BACKUP}" ]; then
            echo "❌ Backup file is empty"
            exit 1
          fi
          echo "✅ Backup file created successfully"

      - name: Drop test table to simulate restore scenario
        run: |
          PGPASSWORD=test psql -h localhost -U test -d azeebo_test -c "DROP TABLE IF EXISTS test_backup_table;"
          echo "Table dropped successfully"

      - name: Restore from backup
        run: |
          LATEST_BACKUP=$(ls -t /tmp/backup_test/*.sql | head -1)
          echo "Restoring from: ${LATEST_BACKUP}"
          PGPASSWORD=test psql -h localhost -U test azeebo_test < "${LATEST_BACKUP}"
          echo "Restore completed"

      - name: Verify restored data
        run: |
          RESULT=$(PGPASSWORD=test psql -h localhost -U test -d azeebo_test -t -c "SELECT data FROM test_backup_table WHERE data = 'backup-verification-test-data';" | tr -d ' ')
          if [ "$RESULT" == "backup-verification-test-data" ]; then
            echo "✅ Restore verification successful - data recovered"
          else
            echo "❌ Restore verification failed. Expected 'backup-verification-test-data', got '$RESULT'"
            exit 1
          fi

      - name: Record RPO/RTO metrics
        run: |
          echo "=== RPO/RTO Acceptance Test Results ==="
