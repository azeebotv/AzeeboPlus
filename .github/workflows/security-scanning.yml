name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22.16.0'
  PNPM_VERSION: '10.33.2'

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  dependency-scanning:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        # Blocking gate: fails on severity >= high outside the expiry-dated
        # allowlist in scripts/audit-gate.mjs (AUD-03).
        run: node scripts/audit-gate.mjs --severity=high
      - name: Run Snyk vulnerability scan (Advisory)
        # Snyk runs in advisory mode when SNYK_TOKEN is provided.
        # Mandatory blocking gates are enforced by audit-gate.mjs and Trivy.
        if: ${{ secrets.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@86b1cee1b8e110a78d528b3e1328a80e218111d2
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  secrets-scanning:
    name: Git Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        # Repinned: the old SHA was a corrupted v2 commit (first 11 chars
        # matched, rest diverged — job failed "unable to find version").
        # This is the real commit the v2 tag points to.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2 tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scanning:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - name: Build Docker image
        run: docker build -t azeebo-scan -f Dockerfile.all-in-one .
      - name: Run Trivy vulnerability scanner
        # Pinned to v0.29.0 — update intentionally
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.29.0
        with:
          image-ref: 'azeebo-scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Without exit-code the action always passes, even with findings.
          exit-code: '1'
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  container-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - name: Run Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile.all-in-one
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Service Dockerfiles must be byte-identical to the template rendered
      # with each service's args, and every FROM must be digest-pinned.
      - run: node scripts/check-dockerfile-drift.mjs
