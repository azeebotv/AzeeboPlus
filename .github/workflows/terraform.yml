name: Terraform

on:
  push:
    branches: [Dev-Branch]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [Dev-Branch]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

env:
  TF_VERSION: '1.9.8'
  AWS_REGION: 'us-east-1'

jobs:
  validate:
    name: Validate Modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - vpc
          - rds
          - ecs
          - elasticache
          - s3
          - cloudfront
          - cloudwatch
          - route53
          - acm
          - waf
          - secrets-manager
          - sqs
          - eventbridge
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: terraform/modules/${{ matrix.module }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform/modules/${{ matrix.module }}

      - name: Terraform Format Check
        run: terraform fmt -check -diff
        working-directory: terraform/modules/${{ matrix.module }}

  plan-gate:
    name: Plan Prerequisites
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      aws_configured: ${{ steps.check.outputs.aws_configured }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.AWS_TERRAFORM_ROLE_ARN }}" ]; then
            echo "aws_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "aws_configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_TERRAFORM_ROLE_ARN is not configured as a repo secret; skipping Plan Production. Add the OIDC role ARN secret (and the matching IAM trust policy) to enable PR plans."
          fi

  plan:
    name: Plan Production
    runs-on: ubuntu-latest
    needs: [validate, plan-gate]
    if: github.event_name == 'pull_request' && needs.plan-gate.outputs.aws_configured == 'true'
    permissions:
      contents: read # checkout of a private repo; a permissions block with
                     # only pull-requests: write strips the default contents
                     # grant and checkout fails with "repository not found"
      pull-requests: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/environments/production

      - name: Terraform Plan
        id: plan
        # certificate_arn/database_password are placeholders: a plan makes no
        # AWS calls with them (empty state, nothing to refresh), but the
        # required variables must still be set for HCL evaluation.
        run: >-
          terraform plan -no-color -input=false -out=tfplan
          -var="certificate_arn=plan-only-placeholder"
          -var="database_password=plan-only-placeholder"
          2>&1 | tee plan.txt
        working-directory: terraform/environments/production

      - name: Comment PR with Plan
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: always() && steps.plan.outcome != 'skipped'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/production/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n\n... (truncated)' : plan;
            const body = `### 📋 Terraform Plan — Production

            \`\`\`
            ${truncated}
            \`\`\`

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting across all modules
        run: |
          echo "Checking terraform format..."
          terraform fmt -check -recursive terraform/
          echo "All files formatted correctly."
