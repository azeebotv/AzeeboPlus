name: Build & Push All-in-One Image

on:
  push:
    branches: [Dev-Branch]
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Force full rebuild (skip all cache)"
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: azeebotv/azeebo-all-in-one

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          echo "==> Freeing disk space before build..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Print build info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "No-cache: ${{ inputs.no_cache || false }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=

      - name: Build and push (cached)
        if: ${{ !inputs.no_cache }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.all-in-one
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://staging.azeeboplus.com' }}

      - name: Build and push (no cache)
        if: ${{ inputs.no_cache }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.all-in-one
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ''
          cache-to: ''
          no-cache: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://staging.azeeboplus.com' }}

      - name: Print image info
        run: |
          echo "✅ Build complete!"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [build-and-push]
    timeout-minutes: 10
    steps:
      - name: Test image starts and health endpoint responds
        run: |
          echo "==> Pulling image..."
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev

          echo "==> Starting container..."
          docker run -d --name smoke-test \
            -e NODE_ENV=production \
            -e ALL_IN_ONE=true \
            -e POSTGRES_PASSWORD=smoke_test_password \
            -e REDIS_PASSWORD=smoke_test_password \
            -e JWT_ACCESS_SECRET=$(openssl rand -base64 64) \
            -e JWT_REFRESH_SECRET=$(openssl rand -base64 64) \
            -e GATEWAY_SECRET=$(openssl rand -base64 64) \
            -e INTERNAL_API_KEY=$(openssl rand -base64 32) \
            -p 3013:3013 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev

          echo "==> Waiting for container to start (60s)..."
          sleep 60

          echo "==> Testing health endpoint..."
          for i in $(seq 1 12); do
            if curl -sf http://localhost:3013/health > /dev/null 2>&1; then
              echo "✅ Health endpoint OK"
              docker logs smoke-test 2>&1 | tail -20
              docker stop smoke-test
              docker rm smoke-test
              exit 0
            fi
            echo "⏳ Attempt $i/12 — retrying in 10s..."
            sleep 10
          done

          echo "❌ Health check failed after 12 attempts"
          docker logs smoke-test 2>&1 | tail -50
          docker stop smoke-test
          docker rm smoke-test
          exit 1
