---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azeebo-web
  namespace: azeebo
  labels:
    app.kubernetes.io/name: azeebo-web
    app.kubernetes.io/part-of: azeebo
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: azeebo-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azeebo-web
        app.kubernetes.io/part-of: azeebo
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: azeebo-web
          image: ghcr.io/vmnl/azeebo-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              protocol: TCP
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: azeebo-web
  namespace: azeebo
  labels:
    app.kubernetes.io/name: azeebo-web
    app.kubernetes.io/part-of: azeebo
spec:
  selector:
    app.kubernetes.io/name: azeebo-web
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
  type: ClusterIP
