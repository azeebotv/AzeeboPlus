---
# API Gateway — always keep at least 2 running during drains
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: azeebo
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: azeebo
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
---
# Auth Service — always keep at least 1 running
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: azeebo
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: azeebo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
