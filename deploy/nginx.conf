worker_processes auto;
# Master runs as root (binds :80/:443, reads certs); workers drop to www-data.
user www-data;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    # AUD-56: connection/ request rate zones (per client IP).
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_webhook:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # When behind a TLS-terminating proxy (Coolify), forwarded requests arrive
    # on :80 with X-Forwarded-Proto=https and must NOT be redirected. Direct
    # cleartext access and the container healthcheck path are the exceptions.
    map "$http_x_forwarded_proto:$uri" $requires_https {
        "~^https:"      0;
        "~^:/health$"   0;
        "~^:/50x.html$" 0;
        default         1;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Upstream definitions
    upstream api_gateway {
        server 127.0.0.1:3013;
    }

    upstream web_app {
        server 127.0.0.1:4000;
    }

    upstream creator {
        server 127.0.0.1:4014;
    }

    upstream admin_panel {
        server 127.0.0.1:4016;
    }

    # Friendly 502 page served while services are starting up
    server {
        listen 8080;
        server_name _;
        location / {
            default_type text/html;
            return 502 '<!DOCTYPE html><html><head><title>Azeebo+ is starting</title><style>body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#0a0a0a;color:#fff}c{text-align:center}h1{font-size:1.5rem;margin-bottom:.5rem}p{color:#888;font-size:.9rem}</style></head><body><c><h1>Azeebo+ is starting up</h1><p>This usually takes 2-3 minutes on first boot. Please wait and refresh.</p></c></body></html>';
        }
    }

    # HTTP server — serves TLS-terminated traffic forwarded by Coolify and
    # redirects anything arriving in cleartext directly on :80 (AUD-56).
    server {
        listen 80;
        server_name _;

        limit_conn conn_per_ip 50;

        if ($requires_https) {
            return 301 https://$host$request_uri;
        }

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Custom error pages for when services are starting up
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Health check
        location /health {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Gateway
        location /api/ {
            proxy_pass http://api_gateway/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            limit_req zone=api_general burst=60 nodelay;
        }

        # Credential endpoints get a tighter per-IP budget than the API at
        # large (brute-force/credential-stuffing damping at the edge).
        location /api/v1/auth/ {
            proxy_pass http://api_gateway/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            limit_req zone=api_auth burst=10 nodelay;
        }

        # Provider webhooks are machine-to-machine: rate-limit abusive floods
        # but leave generous headroom for legit bursty deliveries.
        location /api/v1/webhooks/ {
            proxy_pass http://api_gateway/api/v1/webhooks/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            limit_req zone=api_webhook burst=40 nodelay;
        }

        # Creator Portal
        location /creator/ {
            proxy_pass http://creator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin Panel
        location /admin/ {
            proxy_pass http://admin_panel/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static assets — served directly from disk, bypassing Node.js
        location /_next/static/ {
            alias /app/apps/web/standalone/.next/static/;
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Web App (default)
        location / {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Friendly error pages while services start up
        error_page 502 /502.html;
        location = /502.html {
            default_type text/html;
            return 502 '<!DOCTYPE html><html><head><title>Azeebo+ is starting</title><meta http-equiv="refresh" content="15"><style>body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#0a0a0a;color:#fff}c{text-align:center}h1{font-size:1.5rem;margin-bottom:.5rem}p{color:#888;font-size:.9rem}</style></head><body><c><h1>Azeebo+ is starting up</h1><p>This page will refresh automatically. Please wait and refresh manually if needed.</p></c></body></html>';
            add_header Retry-After 15 always;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _;

        limit_conn conn_per_ip 50;

        ssl_certificate /app/certs/server.crt;
        ssl_certificate_key /app/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Mozilla intermediate suite — forward-secret AEAD ciphers only.
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # API Gateway
        location /api/ {
            proxy_pass http://api_gateway/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            limit_req zone=api_general burst=60 nodelay;
        }

        location /api/v1/auth/ {
            proxy_pass http://api_gateway/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            limit_req zone=api_auth burst=10 nodelay;
        }

        location /api/v1/webhooks/ {
            proxy_pass http://api_gateway/api/v1/webhooks/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            limit_req zone=api_webhook burst=40 nodelay;
        }

        # Health check
        location /health {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Creator Portal
        location /creator/ {
            proxy_pass http://creator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin Panel
        location /admin/ {
            proxy_pass http://admin_panel/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static assets — served directly from disk, bypassing Node.js
        location /_next/static/ {
            alias /app/apps/web/standalone/.next/static/;
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Web App (default)
        location / {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Friendly error pages while services start up
        error_page 502 /502.html;
        location = /502.html {
            default_type text/html;
            return 502 '<!DOCTYPE html><html><head><title>Azeebo+ is starting</title><meta http-equiv="refresh" content="15"><style>body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#0a0a0a;color:#fff}c{text-align:center}h1{font-size:1.5rem;margin-bottom:.5rem}p{color:#888;font-size:.9rem}</style></head><body><c><h1>Azeebo+ is starting up</h1><p>This page will refresh automatically. Please wait and refresh manually if needed.</p></c></body></html>';
            add_header Retry-After 15 always;
        }
    }
}
