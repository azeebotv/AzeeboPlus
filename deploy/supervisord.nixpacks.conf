# ============================================================
# supervisord.nixpacks.conf
# ============================================================
# Nixpacks version — no PostgreSQL, Redis, or PgBouncer.
# These are managed as separate Coolify database resources.
# Only application services are managed here.
# ============================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=warn
user=root

[program:auth-service]
command=/app/service-wrappers/auth-service.sh
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

