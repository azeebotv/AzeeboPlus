# ============================================================
# Azeebo+ All-in-One — Coolify Deployment
# ============================================================
# Single container running everything: PostgreSQL, Redis,
# PgBouncer, all 28 microservices, and all 4 frontends.
#
# Usage in Coolify:
#   1. Create a new project → "Docker Compose" type
#   2. Point to this file: docker-compose.all-in-one.yml
#   3. Add all env vars in the Coolify UI
#   4. Deploy
#
# This is the simplest deployment option.
# Requires a VPS with at least 8GB RAM.
# ============================================================

services:
  azeebo:
    # Version selector set by the deploy workflow on the Coolify app, so a
    # redeploy pulls the tag CI just published instead of a fixed :dev.
    image: ghcr.io/azeebotv/azeebo-all-in-one:${IMAGE_TAG:-dev}
    pull_policy: always
    container_name: azeebo-all-in-one
    labels:
      - 'azeebo.service=all-in-one'
      - 'azeebo.category=infrastructure'
      - 'azeebo.port=3013,4000,4014,4016'
      - 'org.opencontainers.image.source=https://github.com/azeebotv/AzeeboPlus'
      - 'org.opencontainers.image.description=Azeebo+ All-in-One Production Container'
      - 'org.opencontainers.image.licenses=Proprietary'
      - 'com.azeeboplus.tier=production'
    ports:
      - '3013:3013' # API Gateway
      - '4000:4000' # Web App
      - '4014:4014' # Creator Portal
      - '4016:4016' # Admin Panel
    environment:
      NODE_ENV: production
      ALL_IN_ONE: 'true'

      # PostgreSQL
      POSTGRES_USER: ${POSTGRES_USER:-azeebo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-azeebo_dev}

      # Redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Auth
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GATEWAY_SECRET: ${GATEWAY_SECRET:-${INTERNAL_API_KEY}}
      GATEWAY_ENDPOINT_ENFORCEMENT: ${GATEWAY_ENDPOINT_ENFORCEMENT:-true}

      # Payment
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET:-}
      FLW_SECRET_KEY: ${FLW_SECRET_KEY:-}
      FLW_WEBHOOK_SECRET: ${FLW_WEBHOOK_SECRET:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}

      # Email
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}

      # Notification Providers
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}

      # AWS
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}

      # Frontend
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${APP_HOST}}
      API_GATEWAY_URL: http://localhost:3013
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:80,https://localhost:443,https://${APP_HOST}}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:80,https://localhost:443,https://${APP_HOST}}

      # Analytics (NEW - required for event tracking)
      ANALYTICS_SERVICE_URL: http://localhost:3008

      # WebSocket (NEW - required for messaging/realtime)
      WS_CORS_ORIGIN: ${WS_CORS_ORIGIN:-https://${APP_HOST}}

      # Feature Flags (NEW - required for content-service)
      FEATURE_FLAG_REDIS_URL: redis://:${REDIS_PASSWORD}@localhost:6379

      # Event Bus (NEW - required for wallet-service)
      EVENT_BUS_REDIS_URL: redis://:${REDIS_PASSWORD}@localhost:6379

      # OpenTelemetry (NEW - required for observability)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-azeebo-platform}

      # DB Passwords (all default to POSTGRES_PASSWORD if not set)
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      SEARCH_DB_PASSWORD: ${SEARCH_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      REWARD_DB_PASSWORD: ${REWARD_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      RECOMMENDATION_DB_PASSWORD: ${RECOMMENDATION_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      REALITY_DB_PASSWORD: ${REALITY_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      MOVIE_DB_PASSWORD: ${MOVIE_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      COMEDY_DB_PASSWORD: ${COMEDY_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      GAMES_DB_PASSWORD: ${GAMES_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      QUEUE_DB_PASSWORD: ${QUEUE_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      LIFESTYLE_DB_PASSWORD: ${LIFESTYLE_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      VERTICAL_DB_PASSWORD: ${VERTICAL_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      CREATOR_DB_PASSWORD: ${CREATOR_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      SUPPORT_DB_PASSWORD: ${SUPPORT_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      SPORTS_DB_PASSWORD: ${SPORTS_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      MODERATION_DB_PASSWORD: ${MODERATION_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      ENGAGEMENT_DB_PASSWORD: ${ENGAGEMENT_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      MESSAGING_DB_PASSWORD: ${MESSAGING_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      REFERRAL_DB_PASSWORD: ${REFERRAL_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      SUBSCRIPTION_DB_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      LIVE_EVENT_DB_PASSWORD: ${LIVE_EVENT_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-${POSTGRES_PASSWORD}}

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - redis-data:/var/lib/redis

    restart: unless-stopped
    shm_size: 1g
    stop_grace_period: 60s

    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3013/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

    deploy:
      resources:
        limits:
          memory: 12G
          cpus: '4.0'

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
