---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: azeebo
  labels:
    app.kubernetes.io/name: recommendation-service
    app.kubernetes.io/part-of: azeebo
    app.kubernetes.io/component: intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: recommendation-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recommendation-service
        app.kubernetes.io/part-of: azeebo
        app.kubernetes.io/component: intelligence
    spec:
      containers:
        - name: recommendation-service
          image: ghcr.io/vmnl/recommendation-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3010
              protocol: TCP
          envFrom:
            - configMapRef:
                name: azeebo-config
            - secretRef:
                name: azeebo-secrets
                optional: true
          env:
            - name: PORT
              value: "3010"
            - name: SERVICE_NAME
              value: "recommendation-service"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: azeebo
  labels:
    app.kubernetes.io/name: recommendation-service
    app.kubernetes.io/part-of: azeebo
spec:
  selector:
    app.kubernetes.io/name: recommendation-service
  ports:
    - port: 3010
      targetPort: 3010
      protocol: TCP
      name: http
  type: ClusterIP
