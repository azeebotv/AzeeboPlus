---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: azeebo
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: azeebo
    app.kubernetes.io/component: gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: azeebo
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/vmnl/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3013
              protocol: TCP
          envFrom:
            - configMapRef:
                name: azeebo-config
            - secretRef:
                name: azeebo-secrets
                optional: true
          env:
            - name: PORT
              value: "3013"
            - name: SERVICE_NAME
              value: "api-gateway"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3013
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3013
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 3013
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: azeebo
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: azeebo
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - port: 3013
      targetPort: 3013
      protocol: TCP
      name: http
  type: ClusterIP
