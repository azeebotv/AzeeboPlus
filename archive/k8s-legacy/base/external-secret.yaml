# Reference template — requires the External Secrets Operator (ESO) to be
# installed in the cluster. The secret material itself lives in the external
# provider (AWS Secrets Manager, Vault, GCP SM, ...) under `remoteRef.key`.
# Never commit rendered Secret manifests.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: azeebo-secrets
  namespace: azeebo
  labels:
    app.kubernetes.io/part-of: azeebo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azeebo-secret-store
    kind: ClusterSecretStore
  target:
    name: azeebo-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: azeebo/production
        property: database_url
    - secretKey: REDIS_URL
      remoteRef:
        key: azeebo/production
        property: redis_url
    - secretKey: JWT_SECRET
      remoteRef:
        key: azeebo/production
        property: jwt_secret
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: azeebo/production
        property: jwt_refresh_secret
    - secretKey: SMTP_HOST
      remoteRef:
        key: azeebo/production
        property: smtp_host
    - secretKey: SMTP_USER
      remoteRef:
        key: azeebo/production
        property: smtp_user
    - secretKey: SMTP_PASS
      remoteRef:
        key: azeebo/production
        property: smtp_pass
    - secretKey: PAYSTACK_SECRET_KEY
      remoteRef:
        key: azeebo/production
        property: paystack_secret_key
    - secretKey: FLUTTERWAVE_SECRET_KEY
      remoteRef:
        key: azeebo/production
        property: flutterwave_secret_key
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: azeebo/production
        property: google_client_id
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: azeebo/production
        property: google_client_secret
    - secretKey: S3_BUCKET
      remoteRef:
        key: azeebo/production
        property: s3_bucket
    - secretKey: S3_REGION
      remoteRef:
        key: azeebo/production
        property: s3_region
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: azeebo/production
        property: s3_access_key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: azeebo/production
        property: s3_secret_key
    - secretKey: SMTP_PORT
      remoteRef:
        key: azeebo/production
        property: smtp_port
