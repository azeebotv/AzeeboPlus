<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="symbolFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5251C"/>
      <stop offset="40%" stop-color="#F3501A"/>
      <stop offset="80%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFA02E"/>
    </linearGradient>
    <filter id="vantaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F3501A" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <rect width="256" height="256" rx="56" fill="#050505"/>
  <rect width="254" height="254" x="1" y="1" rx="55" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <g transform="translate(18, 18)" filter="url(#vantaGlow)">
    <!-- Swirl Ring -->
    <circle cx="100" cy="110" r="68" fill="none" stroke="url(#symbolFlame)" stroke-width="32" stroke-linecap="round"/>
    
    <!-- Dynamic Inner Curve -->
    <path d="M 60 70 Q 100 50 140 70 Q 160 110 140 150 Q 100 170 60 150 Q 40 110 60 70 Z" fill="url(#symbolFlame)" opacity="0.3"/>

    <!-- Starburst Plus Spark -->
    <g transform="translate(145, 30) scale(0.9)">
      <path d="M 25 0 C 25 14 36 25 50 25 C 36 25 25 36 25 50 C 25 36 14 25 0 25 C 14 25 25 14 25 0 Z" fill="url(#symbolFlame)"/>
      <circle cx="25" cy="25" r="5" fill="#FFA02E"/>
    </g>
  </g>
</svg>
