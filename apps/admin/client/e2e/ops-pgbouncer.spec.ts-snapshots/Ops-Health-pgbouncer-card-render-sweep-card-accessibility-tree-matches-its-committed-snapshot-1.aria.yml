- img
- text: "/pgbouncer pools DEGRADED probed in 7 ms Warning: client connections ≥\\d+% of max_client_conn — approaching the ceiling\\. \\d+ \\/ \\d+ clients \\(\\d+%\\)/"
- table:
  - rowgroup:
    - row "Database User Clients active Clients waiting Servers active Servers idle":
      - columnheader "Database"
      - columnheader "User"
      - columnheader "Clients active"
      - columnheader "Clients waiting"
      - columnheader "Servers active"
      - columnheader "Servers idle"
  - rowgroup:
    - row /azeebo_admin azeebo \d+ 3 \d+ \d+/:
      - cell "azeebo_admin"
      - cell "azeebo"
      - cell /\d+/
      - cell "3"
      - cell /\d+/
      - cell /\d+/
    - row /azeebo_creator azeebo \d+ 0 \d+ 9/:
      - cell "azeebo_creator"
      - cell "azeebo"
      - cell /\d+/
      - cell "0"
      - cell /\d+/
      - cell "9"
- paragraph: Per-service pool budgets
- table:
  - rowgroup:
    - row "Database Service connection_limit Uncapped":
      - columnheader "Database"
      - columnheader "Service"
      - columnheader "connection_limit"
      - columnheader "Uncapped"
  - rowgroup:
    - row /azeebo_admin @azeebo\/admin \d+ —/:
      - cell "azeebo_admin"
      - cell "@azeebo/admin"
      - cell /\d+/
      - cell "—"
    - row /@azeebo\/api \d+ —/:
      - cell
      - cell "@azeebo/api"
      - cell /\d+/
      - cell "—"
    - row "azeebo_creator @azeebo/creator — uncapped":
      - cell "azeebo_creator"
      - cell "@azeebo/creator"
      - cell "—"
      - cell "uncapped"
    - row /azeebo_admin worst case — 2 services \d+/:
      - cell "azeebo_admin"
      - cell "worst case — 2 services"
      - cell /\d+/
      - cell
    - row /azeebo_creator worst case — 1 service \(\+1 uncapped\) \d+\+/:
      - cell "azeebo_creator"
      - cell "worst case — 1 service (+1 uncapped)"
      - cell /\d+\+/
      - cell
- paragraph: Direct-Postgres bypasses
- table:
  - rowgroup:
    - row "Workspace Process PID Conns":
      - columnheader "Workspace"
      - columnheader "Process"
      - columnheader "PID"
      - columnheader "Conns"
  - rowgroup:
    - row /services\/core\/auth-service node \d+ 2/:
      - cell "services/core/auth-service"
      - cell "node"
      - cell /\d+/
      - cell "2"
    - row /apps\/admin node \d+ 1/:
      - cell "apps/admin"
      - cell "node"
      - cell /\d+/
      - cell "1"
- paragraph: /These processes dial Postgres :\d+ directly, skipping pgbouncer — connection limits and pool budgeting do not apply to them\. Restart them on the pooler DATABASE_URL\. \(4 other direct connections on this host belong to different projects, some over IPv6 loopback \(::1\)\.\)/
- table:
  - rowgroup:
    - row "Foreign project Direct conns over IPv6":
      - columnheader "Foreign project"
      - columnheader "Direct conns"
      - columnheader "over IPv6"
  - rowgroup:
    - row "/Users/other/YCN/services/gateway 3 1":
      - cell "/Users/other/YCN/services/gateway"
      - cell "3"
      - cell "1"
    - row "/Users/other/YCN/services/rewards 1 —":
      - cell "/Users/other/YCN/services/rewards"
      - cell "1"
      - cell "—"
- paragraph: "/Context only: these belong to other projects on this host dialing Postgres :\\d+ directly — not azeebo processes, and never counted as bypasses\\. Shown because foreign fleets often bind IPv6 loopback \\(::1\\) exclusively, which changes where you look when chasing connections\\./"
- text: /Foreign dialer persistence — ledger, last \d+[hmsp]+/
- table:
  - rowgroup:
    - row "Foreign project Flagged passes History Span Last seen":
      - columnheader "Foreign project"
      - columnheader "Flagged passes"
      - columnheader "History"
      - columnheader "Span"
      - columnheader "Last seen"
      - columnheader
  - rowgroup:
    - 'row /\/Users\/other\/YCN\/services\/gateway 8 Flagged passes per \d+[hmsp]+ bucket, last \d+[hmsp]+ \(oldest → newest\) — peak bucket: 5 passes [\d,.]+[hmsp]+ \d+:\d+:\d+ AM sustained — tracking issue ↗/':
      - cell "/Users/other/YCN/services/gateway"
      - cell "8"
      - 'cell /Flagged passes per \d+[hmsp]+ bucket, last \d+[hmsp]+ \(oldest → newest\) — peak bucket: 5 passes/':
        - 'img /Flagged passes per \d+[hmsp]+ bucket, last \d+[hmsp]+ \(oldest → newest\) — peak bucket: 5 passes/'
      - cell /[\d,.]+[hmsp]+/
      - cell /\d+:\d+:\d+ AM/
      - cell "sustained — tracking issue ↗":
        - link "sustained — tracking issue ↗":
          - /url: https://github.com/azeebotv/AzeeboPlus/issues/42
    - 'row /\/Users\/other\/YCN\/services\/rewards 3 Flagged passes per \d+[hmsp]+ bucket, last \d+[hmsp]+ \(oldest → newest\) — peak bucket: 1 pass [\d,.]+[hmsp]+ \d+:\d+:\d+ AM below threshold/':
      - cell "/Users/other/YCN/services/rewards"
      - cell "3"
      - 'cell /Flagged passes per \d+[hmsp]+ bucket, last \d+[hmsp]+ \(oldest → newest\) — peak bucket: 1 pass/':
        - 'img /Flagged passes per \d+[hmsp]+ bucket, last \d+[hmsp]+ \(oldest → newest\) — peak bucket: 1 pass/'
      - cell /[\d,.]+[hmsp]+/
      - cell /\d+:\d+:\d+ AM/
      - cell "below threshold"
    - 'row /\/Users\/me\/YCN\/services\/api \d+ Flagged passes per \d+[hmsp]+ bucket, last \d+[hmsp]+ \(oldest → newest\) — peak bucket: 3 passes [\d,.]+[hmsp]+ \d+:\d+:\d+ AM approved — not tracked/':
      - cell "/Users/me/YCN/services/api"
      - cell /\d+/
      - 'cell /Flagged passes per \d+[hmsp]+ bucket, last \d+[hmsp]+ \(oldest → newest\) — peak bucket: 3 passes/':
        - 'img /Flagged passes per \d+[hmsp]+ bucket, last \d+[hmsp]+ \(oldest → newest\) — peak bucket: 3 passes/'
      - cell /[\d,.]+[hmsp]+/
      - cell /\d+:\d+:\d+ AM/
      - cell "approved — not tracked"
- paragraph: "/Per-workspace persistence from the pool-audit ledger \\(same run\\/gap semantics as the nightly foreign-dialer tracker — a span ≥ \\d+[hmsp]+ is what opens its tracking issue\\)\\. History shows each workspace's flagged passes per ~\\d+[hmsp]+ bucket across the window \\(bar height scales to the row's own peak\\)\\. This is history, not a live scan: a workspace can appear here after it stopped dialing\\./"