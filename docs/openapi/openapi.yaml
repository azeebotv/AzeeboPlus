openapi: 3.0.3
info:
  title: Azeebo+ API
  description: |
    The Azeebo+ Entertainment Platform API provides endpoints for:
    - Authentication and user management
    - Content browsing and streaming
    - Wallet and payments
    - Creator tools
    - Real-time messaging
    - Notifications
  version: 1.0.0
  contact:
    name: Azeebo+ API Support
    email: api-support@azeebo.com
    url: https://azeebo.com/support
  license:
    name: Proprietary
    url: https://azeebo.com/terms

servers:
  - url: https://api.azeebo.com
    description: Production
  - url: https://staging-api.azeebo.com
    description: Staging
  - url: http://localhost:3013
    description: Local Development

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Authentication and authorization
  - name: Users
    description: User management
  - name: Content
    description: Content browsing and management
  - name: Wallet
    description: Wallet and balance
  - name: Payments
    description: Payment processing
  - name: Creators
    description: Creator tools and analytics
  - name: Messaging
    description: Real-time messaging
  - name: Notifications
    description: Push and in-app notifications
  - name: Search
    description: Full-text search
  - name: Recommendations
    description: AI-powered recommendations

paths:
  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
        '409':
          description: Email already exists

  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
        '429':
          description: Too many requests

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid refresh token

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      responses:
        '200':
          description: Logged out successfully

  /v1/users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      tags: [Users]
      summary: Update current user profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated

  /v1/users/me/avatar:
    post:
      tags: [Users]
      summary: Upload avatar image
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string

  /v1/content/trending:
    get:
      tags: [Content]
      summary: Get trending content
      parameters:
        - name: universe
          in: query
          schema:
            type: string
            enum: [movies, music, comedy, reality, sports, lifestyle, games, vertical]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Trending content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentList'

  /v1/content/{id}:
    get:
      tags: [Content]
      summary: Get content details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Content details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '404':
          description: Content not found

  /v1/wallet:
    get:
      tags: [Wallet]
      summary: Get wallet balance
      responses:
        '200':
          description: Wallet balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'

  /v1/wallet/fund:
    post:
      tags: [Wallet]
      summary: Fund wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundWalletRequest'
      responses:
        '200':
          description: Payment initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'

  /v1/payments:
    get:
      tags: [Payments]
      summary: Get payment history
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Payment history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'

  /v1/creators:
    get:
      tags: [Creators]
      summary: Get creator profiles
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Creator profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorList'

  /v1/creators/{id}:
    get:
      tags: [Creators]
      summary: Get creator profile details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Creator profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Creator'

  /v1/messaging/conversations:
    get:
      tags: [Messaging]
      summary: Get user conversations
      responses:
        '200':
          description: Conversations list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'

  /v1/notifications:
    get:
      tags: [Notifications]
      summary: Get user notifications
      parameters:
        - name: unread
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Notifications list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'

  /v1/search:
    get:
      tags: [Search]
      summary: Search content
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [content, creator, all]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, username]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        username:
          type: string
          minLength: 3
          maxLength: 30

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        username:
          type: string
        avatar:
          type: string
        createdAt:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
        bio:
          type: string

    Content:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        thumbnail:
          type: string
        videoUrl:
          type: string
        universe:
          type: string
        duration:
          type: integer
        rating:
          type: number
        year:
          type: integer

    ContentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Content'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Wallet:
      type: object
      properties:
        id:
          type: string
        balance:
          type: number
        currency:
          type: string
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'

    Transaction:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [credit, debit]
        amount:
          type: number
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    FundWalletRequest:
      type: object
      required: [amount, provider]
      properties:
        amount:
          type: number
          minimum: 100
        provider:
          type: string
          enum: [stripe, paystack, flutterwave]
        currency:
          type: string
          default: NGN

    PaymentResponse:
      type: object
      properties:
        paymentId:
          type: string
        authorizationUrl:
          type: string
        reference:
          type: string

    PaymentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        total:
          type: integer

    Payment:
      type: object
      properties:
        id:
          type: string
        amount:
          type: number
        status:
          type: string
        provider:
          type: string
        createdAt:
          type: string

    Creator:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        avatar:
          type: string
        subscribers:
          type: integer
        verified:
          type: boolean

    CreatorList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Creator'
        total:
          type: integer

    ConversationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'

    Conversation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        lastMessage:
          type: string
        unreadCount:
          type: integer

    NotificationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        unreadCount:
          type: integer

    Notification:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        createdAt:
          type: string

    SearchResults:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Content'
        creators:
          type: array
          items:
            $ref: '#/components/schemas/Creator'
        total:
          type: integer
