# ============================================================
# Azeebo+ Flag-Chain Containers — real-service CI test
# ============================================================
# Boots the REAL admin API and api-gateway containers against the Redis +
# Postgres service containers of the dockerized-e2e GitHub Actions job, so the
# admin → Redis → service flag chain is exercised ACROSS processes/containers
# (the in-process proof lives in apps/admin feature-flags.redis-live.spec.ts).
#
# The job's redis/postgres service containers publish onto the runner's
# localhost, so these containers reach them via host.docker.internal
# (host-gateway). The driver is scripts/flag-chain-container-check.mjs:
# admin PUTs gateway_maintenance_mode=true → the gateway container must serve
# 503 (maintenance) → admin toggles off → gateway must recover.
#
# Env: FLAGCHAIN_JWT_SECRET — >=64-char secret shared as JWT_ACCESS_SECRET /
#      JWT_REFRESH_SECRET (the admin JwtStrategy enforces HS256 + aud/iss).
#
# Usage (from the repo root, redis + postgres already reachable at
# host.docker.internal:6379 / :5432 with a migrated azeebo_admin_test DB):
#   docker compose -f docker-compose.flagchain.yml build
#   FLAGCHAIN_JWT_SECRET=<secret> docker compose -f docker-compose.flagchain.yml up -d --wait
#   node scripts/flag-chain-container-check.mjs
#   docker compose -f docker-compose.flagchain.yml down
# ============================================================

services:
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: azeebo-ci-admin
    ports:
      - "4016:4016"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JWT_ACCESS_SECRET: ${FLAGCHAIN_JWT_SECRET:?FLAGCHAIN_JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${FLAGCHAIN_JWT_SECRET}
      DATABASE_URL: postgresql://azeebo_test:azeebo_test@host.docker.internal:5432/azeebo_admin_test?schema=public
      REDIS_URL: redis://host.docker.internal:6379
      FEATURE_FLAG_REDIS_URL: redis://host.docker.internal:6379
      PORT: "4016"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:4016/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  gateway:
    build:
      context: .
      dockerfile: services/gateway/api-gateway/Dockerfile
    container_name: azeebo-ci-gateway
    ports:
      - "3013:3013"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JWT_ACCESS_SECRET: ${FLAGCHAIN_JWT_SECRET:?FLAGCHAIN_JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${FLAGCHAIN_JWT_SECRET}
      DATABASE_URL: postgresql://azeebo_test:azeebo_test@host.docker.internal:5432/azeebo_admin_test?schema=public
      REDIS_URL: redis://host.docker.internal:6379
      FEATURE_FLAG_REDIS_URL: redis://host.docker.internal:6379
      PORT: "3013"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3013/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
