# ============================================================
# Azeebo+ Nixpacks Configuration
# ============================================================
# Used by Coolify to build the entire project via Nixpacks.
# All 25+ services, libs, and frontends are built here.
# PostgreSQL and Redis are managed as separate Coolify
# database resources.
#
# Coolify Setup:
#   1. Create a Coolify project
#   2. Add a PostgreSQL database resource → copy the init SQL
#   3. Add a Redis database resource
#   4. Add an Application → select "Nixpacks" build pack
#   5. Point to your repo, set this file's directory as root
#   6. Set environment variables in the Coolify UI
#   7. Set start command: bash ./nixpacks-start.sh
# ============================================================

[phases.setup]
nixPkgs = ["nodejs_22", "postgresql", "redis"]

[phases.install]
cmds = [
  "npm install -g pnpm@10.33.2",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "bash ./scripts/build-all.sh"
]

[start]
cmd = "bash ./nixpacks-start.sh"
