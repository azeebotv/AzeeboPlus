version: '3.8'

volumes:
  postgres_data:
  redis_data:

networks:
  azeebo_network:
    driver: bridge

services:
  postgres:
    image: postgres:15.6-alpine3.19
    container_name: azeebo_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-azeebo_plus_dev}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD must be set}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:?WALLET_DB_PASSWORD must be set}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD must be set}
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD:?CONTENT_DB_PASSWORD must be set}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:?MEDIA_DB_PASSWORD must be set}
      SEARCH_DB_PASSWORD: ${SEARCH_DB_PASSWORD:?SEARCH_DB_PASSWORD must be set}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD must be set}
      REWARD_DB_PASSWORD: ${REWARD_DB_PASSWORD:?REWARD_DB_PASSWORD must be set}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?ANALYTICS_DB_PASSWORD must be set}
      RECOMMENDATION_DB_PASSWORD: ${RECOMMENDATION_DB_PASSWORD:?RECOMMENDATION_DB_PASSWORD must be set}
      REALITY_DB_PASSWORD: ${REALITY_DB_PASSWORD:?REALITY_DB_PASSWORD must be set}
      MOVIE_DB_PASSWORD: ${MOVIE_DB_PASSWORD:?MOVIE_DB_PASSWORD must be set}
      GAMES_DB_PASSWORD: ${GAMES_DB_PASSWORD:?GAMES_DB_PASSWORD must be set}
      COMEDY_DB_PASSWORD: ${COMEDY_DB_PASSWORD:?COMEDY_DB_PASSWORD must be set}
      SPORTS_DB_PASSWORD: ${SPORTS_DB_PASSWORD:?SPORTS_DB_PASSWORD must be set}
      LIFESTYLE_DB_PASSWORD: ${LIFESTYLE_DB_PASSWORD:?LIFESTYLE_DB_PASSWORD must be set}
      VERTICAL_DB_PASSWORD: ${VERTICAL_DB_PASSWORD:?VERTICAL_DB_PASSWORD must be set}
      CREATOR_DB_PASSWORD: ${CREATOR_DB_PASSWORD:?CREATOR_DB_PASSWORD must be set}
      SUPPORT_DB_PASSWORD: ${SUPPORT_DB_PASSWORD:?SUPPORT_DB_PASSWORD must be set}
      MODERATION_DB_PASSWORD: ${MODERATION_DB_PASSWORD:?MODERATION_DB_PASSWORD must be set}
      QUEUE_DB_PASSWORD: ${QUEUE_DB_PASSWORD:?QUEUE_DB_PASSWORD must be set}
      REFERRAL_DB_PASSWORD: ${REFERRAL_DB_PASSWORD:?REFERRAL_DB_PASSWORD must be set}
      ENGAGEMENT_DB_PASSWORD: ${ENGAGEMENT_DB_PASSWORD:?ENGAGEMENT_DB_PASSWORD must be set}
      MESSAGING_DB_PASSWORD: ${MESSAGING_DB_PASSWORD:?MESSAGING_DB_PASSWORD must be set}
      SUBSCRIPTION_DB_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD:?SUBSCRIPTION_DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - azeebo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: azeebo_pgbouncer
    ports:
      - "6432:6432"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      SERVER_TLS_SSLMODE: prefer
    volumes:
      - ./infra/config/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infra/config/pgbouncer_userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks:
      - azeebo_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: azeebo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - azeebo_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: azeebo_auth_service
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${AUTH_DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-azeebo-auth-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-azeebo-api}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - azeebo_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

