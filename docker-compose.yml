

services:
  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: services/core/auth-service/Dockerfile
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - azeebo-network

  # Engagement Service
  engagement-service:
    build:
      context: .
      dockerfile: services/engagement/engagement-service/Dockerfile
    ports:
      - "3002:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - azeebo-network

  # Support Service
  support-service:
    build:
      context: .
      dockerfile: services/operations/support-service/Dockerfile
    ports:
      - "3003:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - azeebo-network

  # Universe Service (Lifestyle)
  lifestyle-service:
    build:
      context: .
      dockerfile: services/universes/lifestyle-service/Dockerfile
    ports:
      - "3004:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - azeebo-network

  # Web App
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - auth-service
      - engagement-service
      - support-service
      - lifestyle-service
    networks:
      - azeebo-network

  # Admin App
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    ports:
      - "3005:3000"
    env_file:
      - .env
    depends_on:
      - auth-service
      - engagement-service
      - support-service
      - lifestyle-service
    networks:
      - azeebo-network

  # Database
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - azeebo-network

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - azeebo-network

# Networks
networks:
  azeebo-network:
    driver: bridge

# Volumes
volumes:
  postgres-data:
  redis-data: