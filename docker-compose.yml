      <<: *common-env
      PORT: "3013"
      # Service discovery — gateway routes to these Docker hostnames
      AUTH_SERVICE_URL: http://auth-service:3000
      USER_SERVICE_URL: http://user-service:3001
      WALLET_SERVICE_URL: http://wallet-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003
      CONTENT_SERVICE_URL: http://content-service:3004
      SEARCH_SERVICE_URL: http://search-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      REWARD_SERVICE_URL: http://reward-service:3007
      ANALYTICS_SERVICE_URL: http://analytics-service:3008
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:3009
      REALITY_SERVICE_URL: http://reality-service:3010
      MOVIE_SERVICE_URL: http://movie-service:3011
      COMEDY_SERVICE_URL: http://comedy-service:3012
      GAMES_SERVICE_URL: http://games-service:3014
      QUEUE_SERVICE_URL: http://queue-service:3015
      LIFESTYLE_SERVICE_URL: http://lifestyle-service:3016
      VERTICAL_SERVICE_URL: http://vertical-service:3017
      CREATOR_SERVICE_URL: http://creator-service:3018
      MEDIA_SERVICE_URL: http://media-service:3019
      SUPPORT_SERVICE_URL: http://support-service:3020
      SPORTS_SERVICE_URL: http://sports-service:3021
      MODERATION_SERVICE_URL: http://moderation-service:3022
      ENGAGEMENT_SERVICE_URL: http://engagement-service:3023
      MESSAGING_SERVICE_URL: http://messaging-service:3024
      REFERRAL_SERVICE_URL: http://referral-service:3025
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:3026
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
    profiles:
      - gateway
      - all

  # ============================================================
  # FRONTEND APPLICATIONS
  # ============================================================

  web-app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: azeebo_web_app
    ports:
      - "${WEB_PORT:-4000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_GATEWAY_URL: http://api-gateway:3013
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${WEB_PORT:-4000}}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${WEB_PORT:-4000}}
    networks:
      - frontend
      - backend
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    profiles:
      - frontend
      - all

  admin-app:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: azeebo_admin_app
    ports:
      - "${ADMIN_PORT:-4016}:4016"
    environment:
      <<: *common-env
      PORT: "4016"
      DATABASE_URL: postgresql://azeebo:${ADMIN_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin_db?schema=public
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4016').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    profiles:
      - frontend
      - all

  creator-portal-app:
    build:
      context: .
      dockerfile: apps/creator-portal/Dockerfile
    container_name: azeebo_creator_portal
    ports:
      - "${CREATOR_PORTAL_PORT:-4014}:4014"
    environment:
      <<: *common-env
      PORT: "4014"
      DATABASE_URL: postgresql://azeebo:${CREATOR_PORTAL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/creator_portal_db?schema=public
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4014').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    profiles:
      - frontend
      - all

  # ============================================================
  # MONITORING (opt-in via --profile monitoring)
  # ============================================================

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: azeebo_prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    networks:
      - backend
      - monitoring
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    profiles:
      - monitoring
      - all

  grafana:
    image: grafana/grafana:11.1.0
    container_name: azeebo_grafana
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    profiles:
      - monitoring
      - all

# ============================================================
# NETWORKS
# Isolated tiers for defense-in-depth:
#   data        — postgres, redis (database only)
#   backend     — all microservices + gateway (can reach data)
#   frontend    — web/admin/creator-portal (can reach backend)
#   monitoring  — prometheus, grafana
# ============================================================
networks:
  data:
    driver: bridge
    name: azeebo_data
  backend:
    driver: bridge
    name: azeebo_backend
  frontend:
    driver: bridge
    name: azeebo_frontend
  monitoring:
    driver: bridge
    name: azeebo_monitoring

# ============================================================
# VOLUMES — persistent data across container restarts
# ============================================================
volumes:
  postgres-data:
    driver: local
    name: azeebo_postgres_data
  redis-data:
    driver: local
    name: azeebo_redis_data
  prometheus-data:
    driver: local
    name: azeebo_prometheus_data
  grafana-data:
    driver: local
    name: azeebo_grafana_data
