      - redis
    networks:
      - azeebo_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Queue Service (BullMQ)
  queue-service:
    build:
      context: ./services/queue-service
      dockerfile: Dockerfile
    container_name: azeebo_queue_service
    ports:
      - "3015:3015"
    environment:
      NODE_ENV: production
      PORT: 3015
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:?err}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:?err}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:?err}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:?err}
    depends_on:
      - redis
    networks:
      - azeebo_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3015"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Media Service (S3 Upload & CDN)
  media-service:
    build:
      context: ./services/media-service
      dockerfile: Dockerfile
    container_name: azeebo_media_service
    ports:
      - "3019:3019"
    environment:
      NODE_ENV: production
      PORT: 3019
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: azeebo-media
      CDN_URL: ${CDN_URL}
    depends_on:
      - redis
    networks:
      - azeebo_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3019/health"]
