version: '3.8'

volumes:
  postgres_data:
  redis_data:

networks:
  azeebo_network:
    driver: bridge

services:
  postgres:
    image: postgres:15.6-alpine3.19
    container_name: azeebo_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-azeebo_plus_dev}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_dev_password}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:-user_dev_password}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:-wallet_dev_password}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_dev_password}
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD:-content_dev_password}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:-media_dev_password}
      SEARCH_DB_PASSWORD: ${SEARCH_DB_PASSWORD:-search_dev_password}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_dev_password}
      REWARD_DB_PASSWORD: ${REWARD_DB_PASSWORD:-reward_dev_password}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics_dev_password}
      RECOMMENDATION_DB_PASSWORD: ${RECOMMENDATION_DB_PASSWORD:-recommendation_dev_password}
      REALITY_DB_PASSWORD: ${REALITY_DB_PASSWORD:-reality_dev_password}
      MOVIE_DB_PASSWORD: ${MOVIE_DB_PASSWORD:-movie_dev_password}
      GAMES_DB_PASSWORD: ${GAMES_DB_PASSWORD:-games_dev_password}
      COMEDY_DB_PASSWORD: ${COMEDY_DB_PASSWORD:-comedy_dev_password}
      SPORTS_DB_PASSWORD: ${SPORTS_DB_PASSWORD:-sports_dev_password}
      LIFESTYLE_DB_PASSWORD: ${LIFESTYLE_DB_PASSWORD:-lifestyle_dev_password}
      VERTICAL_DB_PASSWORD: ${VERTICAL_DB_PASSWORD:-vertical_dev_password}
      CREATOR_DB_PASSWORD: ${CREATOR_DB_PASSWORD:-creator_dev_password}
      SUPPORT_DB_PASSWORD: ${SUPPORT_DB_PASSWORD:-support_dev_password}
      MODERATION_DB_PASSWORD: ${MODERATION_DB_PASSWORD:-moderation_dev_password}
      QUEUE_DB_PASSWORD: ${QUEUE_DB_PASSWORD:-queue_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - azeebo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1
    container_name: azeebo_pgbouncer
    ports:
      - "6432:6432"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      SERVER_TLS_SSLMODE: prefer
    volumes:
      - ./infra/config/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infra/config/pgbouncer_userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks:
      - azeebo_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: azeebo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - azeebo_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: azeebo_auth_service
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${AUTH_DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-azeebo-auth-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-azeebo-api}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - azeebo_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: azeebo_user_service
