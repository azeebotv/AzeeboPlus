# ============================================================
# Azeebo+ — Full-Stack Docker Compose
# ============================================================
# Quick start:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d   # start infrastructure + all services
#
# Selective startup:
#   docker compose --profile core up -d       # core domain only
#   docker compose --profile monitoring up -d  # add Prometheus + Grafana
#
# View logs:
#   docker compose logs -f api-gateway
#   docker compose ps                        # health status
#
# Stop everything:
#   docker compose down -v                    # -v removes volumes
# ============================================================

# ------------------------------------------------------------------
# Shared YAML anchors — DRY configuration across ~30 services
# ------------------------------------------------------------------
x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-development}
  REDIS_URL: redis://redis:6379
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"

x-nestjs-service: &nestjs-service
  restart: unless-stopped
  networks:
    - backend
  # Health check — every NestJS service exposes GET /health
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:${PORT:-3000}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s
  # Logging with rotation
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
  # Resource caps — adjust per service below
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "0.5"
  # Security: run as non-root, drop all capabilities, no new privileges
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# ============================================================
# SERVICES
# ============================================================
services:

  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  # --- PostgreSQL ---
  # Primary datastore. One database per microservice, created by
  # scripts/docker-init-databases.sh on first run.
  postgres:
    image: postgres:15-alpine
    container_name: azeebo_postgres
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-azeebo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-azeebo_plus_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/docker-init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-azeebo} -d ${POSTGRES_DB:-azeebo_plus_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - data
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    # Postgres performance tuning for local dev
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=8MB
        -c maintenance_work_mem=128MB
        -c max_connections=100
        -c log_min_duration_statement=500
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # --- Redis ---
  # Caching, sessions, rate limiting. AOF persistence enabled.
  redis:
    image: redis:7-alpine
    container_name: azeebo_redis
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    command: >
      redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
        --save 60 10000
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"

  # --- MailHog ---
  # Local email catcher. UI at http://localhost:8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: azeebo_mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - backend
    deploy:
