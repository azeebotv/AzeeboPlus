    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3016/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Vertical Service (Universe Map & Character Management)
  vertical-service:
    build:
      context: ./services/vertical-service
      dockerfile: Dockerfile
    container_name: azeebo_vertical_service
    ports:
      - "3017:3017"
    environment:
      NODE_ENV: production
      PORT: 3017
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - postgres
    networks:
      - azeebo_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3017/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Web App
  web-app:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: azeebo_web_app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
    depends_on:
      - auth-service
      - user-service
      - content-service
    networks:
      - azeebo_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 5