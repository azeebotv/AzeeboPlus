version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: azeebo-postgres-test
    environment:
      POSTGRES_USER: azeebo_test
      POSTGRES_PASSWORD: azeebo_test_password
      POSTGRES_DB: azeebo_test_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azeebo_test -d azeebo_test_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-test:
    image: redis:7-alpine
    container_name: azeebo-redis-test
    command: redis-server --appendonly yes --requirepass redis_test_password
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_test_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mysql-test:
    image: mysql:8
    container_name: azeebo-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: mysql_root_password
      MYSQL_DATABASE: azeebo_test_db
      MYSQL_USER: azeebo_test
      MYSQL_PASSWORD: azeebo_test_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmysql_root_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_test_data:
  redis_test_data:
  mysql_test_data:

networks:
  default:
    name: azeebo-test-network