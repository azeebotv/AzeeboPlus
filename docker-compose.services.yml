    environment:
      <<: *common-env
      PORT: "3003"
      DATABASE_URL: postgresql://payment_user:${PAYMENT_DB_PASSWORD}@pgbouncer:6432/payment_db?schema=public
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      FLW_SECRET_KEY: ${FLW_SECRET_KEY}
    profiles:
      - core
      - all

  content-service:
    <<: *nestjs-service
    build:
      context: .
