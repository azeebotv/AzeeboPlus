# Azeebo+ Application Services
# Usage: docker compose -f docker-compose.yml -f docker-compose.services.yml up -d
# With profiles: docker compose -f docker-compose.yml -f docker-compose.services.yml --profile core up -d
# All profiles: docker compose -f docker-compose.yml -f docker-compose.services.yml --profile all up -d

x-common-env: &common-env
  NODE_ENV: development
  REDIS_URL: redis://redis:6379
  POSTGRES_HOST: pgbouncer
  POSTGRES_PORT: "6432"

x-nestjs-service: &nestjs-service
  restart: unless-stopped
  networks:
    - azeebo_network
  depends_on:
    postgres:
      condition: service_healthy
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ============================================================
  # CORE DOMAIN
  # ============================================================
  auth-service:
    <<: *nestjs-service
    build:
      context: .
      dockerfile: services/core/auth-service/Dockerfile
    container_name: azeebo_auth_service
    ports:
      - "3000:3000"
    environment:
      <<: *common-env
      PORT: "3000"
      DATABASE_URL: postgresql://auth_user:${AUTH_DB_PASSWORD}@pgbouncer:6432/auth_db?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    profiles:
      - core
      - all

  user-service:
    <<: *nestjs-service
    build:
      context: .
      dockerfile: services/core/user-service/Dockerfile
    container_name: azeebo_user_service
    ports:
      - "3001:3001"
    environment:
      <<: *common-env
      PORT: "3001"
      DATABASE_URL: postgresql://user_user:${USER_DB_PASSWORD}@pgbouncer:6432/user_db?schema=public
    profiles:
      - core
      - all

  wallet-service:
    <<: *nestjs-service
    build:
      context: .
      dockerfile: services/core/wallet-service/Dockerfile
