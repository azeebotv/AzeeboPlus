# Azeebo+ Local Development - Full Stack
# Usage: docker compose -f docker-compose.services.yml up -d
# Build only: docker compose -f docker-compose.services.yml build
# Logs: docker compose -f docker-compose.services.yml logs -f [service]

x-common-env: &common-env
  NODE_ENV: development
  REDIS_URL: redis://redis:6379
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"

x-nestjs-service: &nestjs-service
  restart: unless-stopped
  networks:
    - azeebo_network
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ============================================================
  # INFRASTRUCTURE
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: azeebo_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-azeebo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-azeebo_dev_2024}
      POSTGRES_DB: ${POSTGRES_DB:-azeebo_plus_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/docker-init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-azeebo} -d ${POSTGRES_DB:-azeebo_plus_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - azeebo_network

  redis:
    image: redis:7-alpine
    container_name: azeebo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - azeebo_network

  # ============================================================
  # CORE DOMAIN
  # ============================================================
  auth-service:
    <<: *nestjs-service
    build:
      context: .
      dockerfile: services/core/auth-service/Dockerfile
    container_name: azeebo_auth_service
    ports:
      - "3000:3000"
    environment:
      <<: *common-env
      PORT: "3000"
      DATABASE_URL: postgresql://azeebo:${AUTH_DB_PASSWORD:-azeebo_dev_2024}@postgres:5432/auth_db?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    profiles:
      - core
      - all

  user-service:
    <<: *nestjs-service
