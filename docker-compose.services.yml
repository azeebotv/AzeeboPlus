  support-service:
    <<: *nestjs-service
    build:
      context: .
      dockerfile: services/operations/support-service/Dockerfile
    container_name: azeebo_support_service
    ports:
      - "3020:3020"
    environment:
      <<: *common-env
      PORT: "3020"
      DATABASE_URL: postgresql://support_user:${SUPPORT_DB_PASSWORD}@pgbouncer:6432/support_db?schema=public
    profiles:
      - operations
      - all

  moderation-service:
    <<: *nestjs-service
    build:
      context: .
      dockerfile: services/operations/moderation-service/Dockerfile
    container_name: azeebo_moderation_service
    ports:
      - "3022:3022"
    environment:
      <<: *common-env
      PORT: "3022"
      DATABASE_URL: postgresql://moderation_user:${MODERATION_DB_PASSWORD}@pgbouncer:6432/moderation_db?schema=public
    profiles:
      - operations
      - all

  # ============================================================
  # GATEWAY
  # ============================================================
  api-gateway:
    <<: *nestjs-service
    build:
      context: .
      dockerfile: services/gateway/api-gateway/Dockerfile
    container_name: azeebo_api_gateway
    ports:
      - "3013:3013"
    environment:
      <<: *common-env
      PORT: "3013"
      AUTH_SERVICE_URL: http://auth-service:3000
      USER_SERVICE_URL: http://user-service:3001
      WALLET_SERVICE_URL: http://wallet-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003
      CONTENT_SERVICE_URL: http://content-service:3004
      SEARCH_SERVICE_URL: http://search-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      REWARD_SERVICE_URL: http://reward-service:3007
      ANALYTICS_SERVICE_URL: http://analytics-service:3008
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:3009
      REALITY_SERVICE_URL: http://reality-service:3010
      MOVIE_SERVICE_URL: http://movie-service:3011
      COMEDY_SERVICE_URL: http://comedy-service:3012
      GAMES_SERVICE_URL: http://games-service:3014
      QUEUE_SERVICE_URL: http://queue-service:3015
      LIFESTYLE_SERVICE_URL: http://lifestyle-service:3016
      VERTICAL_SERVICE_URL: http://vertical-service:3017
      CREATOR_SERVICE_URL: http://creator-service:3018
      MEDIA_SERVICE_URL: http://media-service:3019
      SUPPORT_SERVICE_URL: http://support-service:3020
      SPORTS_SERVICE_URL: http://sports-service:3021
      MODERATION_SERVICE_URL: http://moderation-service:3022
      ENGAGEMENT_SERVICE_URL: http://engagement-service:3023
      MESSAGING_SERVICE_URL: http://messaging-service:3024
      REFERRAL_SERVICE_URL: http://referral-service:3025
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:3026
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    profiles:
      - gateway
      - all

  # ============================================================
  # FRONTEND
  # ============================================================
  web-app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: azeebo_web_app
    ports:
      - "4000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3013
    networks:
      - azeebo_network
    depends_on:
      - api-gateway
    restart: unless-stopped
    profiles:
      - frontend
      - all

  admin-app:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: azeebo_admin_app
    ports:
      - "4016:3016"
    environment:
      <<: *common-env
      PORT: "3016"
      DATABASE_URL: postgresql://admin_user:${ADMIN_DB_PASSWORD}@pgbouncer:6432/admin_db?schema=public
    networks:
      - azeebo_network
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - frontend
      - all

  creator-portal-app:
    build:
      context: .
      dockerfile: apps/creator-portal/Dockerfile
    container_name: azeebo_creator_portal
    ports:
      - "4014:3014"
    environment:
      <<: *common-env
      PORT: "3014"
      DATABASE_URL: postgresql://creator_portal_user:${CREATOR_PORTAL_DB_PASSWORD}@pgbouncer:6432/creator_portal_db?schema=public
