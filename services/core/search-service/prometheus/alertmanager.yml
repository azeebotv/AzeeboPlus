# Minimal Alertmanager config for the local example — runnable as-is.
#
# Every alert is routed to a single webhook receiver. The URL is a placeholder
# that points back at the host; nothing is delivered until you point it at a
# real listener (e.g. a webhook.site/ngrok URL, a local echo server on 9099,
# or Slack/email receivers — see the commented examples below).
#
# Check delivery locally with:
#   python3 -m http.server 9099   # then watch the POST bodies in its logs

route:
  receiver: local-webhook
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-webhook
    webhook_configs:
      - url: http://host.docker.internal:9099/alert
        send_resolved: true

# -----------------------------------------------------------------------------
