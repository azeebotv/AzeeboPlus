apiVersion: v1
kind: Secret
metadata:
  name: azeebo-secrets
  namespace: azeebo
  annotations:
    # Use external secret management in production
    # For AWS: eks.amazonaws.com/service-account: arn:aws:iam::ACCOUNT_ID:role/ROLE_NAME
    # For GCP: iam.gke.io/gcp-service-account: SERVICE_ACCOUNT@PROJECT_ID.iam.gserviceaccount.com
    kubernetes.io/description: "Core application secrets - MUST be replaced before deployment"
type: Opaque
# SECURITY: This file contains placeholder values.
# In production, use one of these approaches:
# 1. External Secrets Operator (recommended)
# 2. Sealed Secrets (https://github.com/bitnami-labs/sealed-secrets)
# 3. HashiCorp Vault
# 4. AWS Secrets Manager / GCP Secret Manager
# 5. Azure Key Vault
#
# Generate secrets with:
#   openssl rand -base64 32  # for JWT secrets
#   openssl rand -hex 32     # for passwords
#
# NEVER commit actual secrets to version control!
data:
  jwt-access-secret: ""  # echo -n 'your-jwt-access-secret' | base64
  jwt-refresh-secret: "" # echo -n 'your-jwt-refresh-secret' | base64
  database-url: ""       # echo -n 'postgresql://user:pass@host:5432/db' | base64
  redis-url: ""          # echo -n 'redis://host:6379' | base64
  REDIS_PASSWORD: ""     # echo -n 'your-redis-password' | base64
---
apiVersion: v1
kind: Secret
metadata:
  name: azeebo-secrets-infra
  namespace: azeebo-infra
  annotations:
    kubernetes.io/description: "Infrastructure secrets - MUST be replaced before deployment"
type: Opaque
# SECURITY: This file contains placeholder values.
# Generate with: openssl rand -base64 32
# Apply with: kubectl apply -f secrets.yaml
# Or use: kubectl create secret generic azeebo-secrets-infra --from-literal=postgres-password=xxx
data:
  postgres-password: ""  # echo -n 'your-postgres-password' | base64
  postgres-user: cG9zdGdyZXM=  # base64('postgres')
  postgres-db: YXplZWJvX3BsdXNfZGV2  # base64('azeebo_plus_dev')