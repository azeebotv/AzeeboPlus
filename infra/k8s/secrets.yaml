apiVersion: v1
kind: Secret
metadata:
  name: azeebo-secrets
  namespace: azeebo
type: Opaque
stringData:
  jwt-secret: ${JWT_SECRET}
  jwt-refresh-secret: ${JWT_REFRESH_SECRET}
  database-url: ${DATABASE_URL}
  redis-url: ${REDIS_URL}
---
apiVersion: v1
kind: Secret
metadata:
  name: azeebo-secrets-infra
  namespace: azeebo-infra
type: Opaque
stringData:
  postgres-password: ${POSTGRES_PASSWORD}
  postgres-user: ${POSTGRES_USER}
  postgres-db: ${POSTGRES_DB:-azeebo_plus_dev}