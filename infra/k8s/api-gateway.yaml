apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: azeebo
  labels:
    app: api-gateway
    tier: backend
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3013"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: azeebo-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - api-gateway
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api-gateway
          image: azeebo/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3013
              protocol: TCP
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3013"
            - name: AUTH_SERVICE_URL
              value: http://auth-service.azeebo.svc.cluster.local:3000
            - name: USER_SERVICE_URL
              value: http://user-service.azeebo.svc.cluster.local:3001
            - name: WALLET_SERVICE_URL
              value: http://wallet-service.azeebo.svc.cluster.local:3002
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service.azeebo.svc.cluster.local:3003
            - name: CONTENT_SERVICE_URL
              value: http://content-service.azeebo.svc.cluster.local:3004
            - name: SEARCH_SERVICE_URL
              value: http://search-service.azeebo.svc.cluster.local:3005
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service.azeebo.svc.cluster.local:3006
            - name: REWARD_SERVICE_URL
              value: http://reward-service.azeebo.svc.cluster.local:3007
            - name: ANALYTICS_SERVICE_URL
              value: http://analytics-service.azeebo.svc.cluster.local:3008
            - name: RECOMMENDATION_SERVICE_URL
              value: http://recommendation-service.azeebo.svc.cluster.local:3009
            - name: REALITY_SERVICE_URL
              value: http://reality-service.azeebo.svc.cluster.local:3010
            - name: QUEUE_SERVICE_URL
              value: http://queue-service.azeebo.svc.cluster.local:3015
            - name: CREATOR_SERVICE_URL
              value: http://creator-service.azeebo.svc.cluster.local:3018
            - name: MEDIA_SERVICE_URL
              value: http://media-service.azeebo.svc.cluster.local:3019
            - name: LIFESTYLE_SERVICE_URL
              value: http://lifestyle-service.azeebo.svc.cluster.local:3016
            - name: VERTICAL_SERVICE_URL
              value: http://vertical-service.azeebo.svc.cluster.local:3017
            - name: SUPPORT_SERVICE_URL
              value: http://support-service.azeebo.svc.cluster.local:3020
            - name: COMEDY_SERVICE_URL
              value: http://comedy-service.azeebo.svc.cluster.local:3012
            - name: GAMES_SERVICE_URL
              value: http://games-service.azeebo.svc.cluster.local:3014
            - name: MOVIE_SERVICE_URL
              value: http://movie-service.azeebo.svc.cluster.local:3011
            - name: SPORTS_SERVICE_URL
              value: http://sports-service.azeebo.svc.cluster.local:3021
            - name: MODERATION_SERVICE_URL
              value: http://moderation-service.azeebo.svc.cluster.local:3022
            - name: ENGAGEMENT_SERVICE_URL
              value: http://engagement-service.azeebo.svc.cluster.local:3023
            - name: MESSAGING_SERVICE_URL
              value: http://messaging-service.azeebo.svc.cluster.local:3024
            - name: REFERRAL_SERVICE_URL
              value: http://referral-service.azeebo.svc.cluster.local:3025
            - name: SUBSCRIPTION_SERVICE_URL
              value: http://subscription-service.azeebo.svc.cluster.local:3026
            - name: ADMIN_SERVICE_URL
              value: http://admin-app.azeebo.svc.cluster.local:4016
            - name: CREATOR_PORTAL_SERVICE_URL
              value: http://creator-portal-app.azeebo.svc.cluster.local:4014
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: redis-url
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3013
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3013
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: azeebo
  labels:
    app: api-gateway
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3013"
spec:
  type: ClusterIP
  ports:
    - port: 3013
      targetPort: 3013
      protocol: TCP
      name: http
  selector:
    app: api-gateway