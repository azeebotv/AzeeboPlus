apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: azeebo
  labels:
    app: api-gateway
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: backend
    spec:
      containers:
        - name: api-gateway
          image: azeebo/api-gateway:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: AUTH_SERVICE_URL
              value: http://auth-service.azeebo.svc.cluster.local:3000
            - name: USER_SERVICE_URL
              value: http://user-service.azeebo.svc.cluster.local:3001
            - name: CONTENT_SERVICE_URL
              value: http://content-service.azeebo.svc.cluster.local:3002
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service.azeebo.svc.cluster.local:3003
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service.azeebo.svc.cluster.local:3004
            - name: QUEUE_SERVICE_URL
              value: http://queue-service.azeebo.svc.cluster.local:3005
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: azeebo
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: api-gateway