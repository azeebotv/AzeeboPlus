apiVersion: v1
kind: ServiceAccount
metadata:
  name: azeebo-deployer
  namespace: azeebo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: azeebo-deployer
  namespace: azeebo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: azeebo-monitoring
  namespace: azeebo
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: azeebo-monitoring
  namespace: azeebo
subjects:
  - kind: ServiceAccount
    name: prometheus-kube-prometheus-stack
    namespace: azeebo-monitoring
roleRef:
  kind: Role
  name: azeebo-monitoring
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: azeebo-deployer
  namespace: azeebo
subjects:
  - kind: ServiceAccount
    name: azeebo-deployer
    namespace: azeebo
roleRef:
  kind: Role
  name: azeebo-deployer
  apiGroup: rbac.authorization.k8s.io