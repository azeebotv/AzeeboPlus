apiVersion: apps/v1
kind: Deployment
metadata:
  name: SERVICE_NAME
  namespace: azeebo
  labels:
    app: SERVICE_NAME
    tier: backend
spec:
  replicas: REPLICA_COUNT
  selector:
    matchLabels:
      app: SERVICE_NAME
  template:
    metadata:
      labels:
        app: SERVICE_NAME
        tier: backend
    spec:
      containers:
        - name: SERVICE_NAME
          image: DOCKER_IMAGE:TAG
          ports:
            - containerPort: PORT
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "PORT"
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@postgres.azeebo-infra.svc.cluster.local:5432/azeebo_plus_dev
            - name: REDIS_URL
              value: redis://redis.azeebo-infra.svc.cluster.local:6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: PORT
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: PORT
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: SERVICE_NAME
  namespace: azeebo
  labels:
    app: SERVICE_NAME
spec:
  type: ClusterIP
  ports:
    - port: PORT
      targetPort: PORT
  selector:
    app: SERVICE_NAME