# Prometheus Alerting Rules

groups:
  - name: AzeeboAlerts
    interval: 30s
    rules:

      # System Health
      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted {{ $value }} times in the last 5 minutes"

      - alert: PodNotReady
        expr: kube_pod_status_ready{condition="true"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in non-ready state for more than 5 minutes"

      - alert: DeploymentReplicasMismatch
        expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has replica mismatch"
          description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has {{ $value }} unavailable replicas"

      # Application Metrics
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.01
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.service }}"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.service }}"
          description: "p95 latency is {{ $value }}s on {{ $labels.service }}"

      - alert: HighRequestRate
        expr: rate(http_requests_total[1m]) > 1000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High request rate on {{ $labels.service }}"
          description: "Request rate is {{ $value }} req/s on {{ $labels.service }}"

      # Database
      - alert: PostgresqlHighConnections
        expr: pg_stat_activity_count > pg_settings_max_connections * 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL high connection count"
          description: "PostgreSQL connections at {{ $value }}%"

      - alert: PostgresqlReplicationLag
        expr: pg_stat_replication_lag_bytes > 104857600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL replication lag >100MB"
          description: "Replication lag is {{ $value }} bytes"

      - alert: PostgresqlSlowQueries
        expr: rate(pg_stat_statements_seconds_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL slow queries detected"

      # Redis
      - alert: RedisLowHitRate
        expr: rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) < 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis hit rate <90%"
          description: "Redis hit rate is {{ $value | humanizePercentage }}"

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage >85%"
          description: "Redis is at {{ $value | humanizePercentage }} memory"

      # Infrastructure
      - alert: HighNodeCPU
        expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.instance }} CPU >90%"
          description: "Node {{ $labels.instance }} CPU usage is {{ $value }}%"

      - alert: HighNodeMemory
        expr: 100 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.instance }} memory >90%"
          description: "Node {{ $labels.instance }} memory usage is {{ $value }}%"

      - alert: HighDiskUsage
        expr: 100 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"} * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage >85% on {{ $labels.instance }}"
          description: "Mount {{ $labels.mountpoint }} is at {{ $value }}%"

      # Authentication Alerts
      - alert: HighAuthFailureRate
        expr: rate(auth_failures_total[5m]) / rate(auth_attempts_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Authentication failure rate >10%"
          description: "Auth failure rate is {{ $value | humanizePercentage }} - potential attack or service issue"

      - alert: HighMfaFailureRate
        expr: rate(mfa_failures_total[5m]) / rate(mfa_attempts_total[5m]) > 0.2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MFA failure rate >20%"
          description: "MFA failure rate is {{ $value | humanizePercentage }}"

      - alert: UnusualLoginPattern
        expr: rate(auth_login_attempts_total[10m]) > 100
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Unusual login pattern detected"
          description: "{{ $value }} login attempts in last 10 minutes - potential brute force attack"

      # Rate Limit Alerts
      - alert: HighRateLimitViolations
        expr: rate(rate_limit_violations_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High rate limit violations on {{ $labels.service }}"
          description: "{{ $value }} rate limit violations in last 5 minutes on {{ $labels.service }}"

      - alert: RateLimitExhaustion
        expr: sum by (service) (rate(rate_limit_remaining[1m])) < 100
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Rate limit exhaustion on {{ $labels.service }}"
          description: "Rate limit nearly exhausted for {{ $labels.service }}"

      # Business Metrics
      - alert: PaymentFailureRate
        expr: rate(payment_transactions_total{status="failed"}[5m]) / rate(payment_transactions_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Payment failure rate >5%"
          description: "Payment failure rate is {{ $value | humanizePercentage }}"

      - alert: PaymentProcessingDelay
        expr: histogram_quantile(0.95, rate(payment_processing_duration_seconds_bucket[5m])) > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High payment processing latency"
          description: "p95 payment processing time is {{ $value }}s"

      - alert: WalletTransactionFailure
        expr: rate(wallet_transactions_total{status="failed"}[5m]) / rate(wallet_transactions_total[5m]) > 0.02
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Wallet transaction failure rate >2%"
          description: "Wallet transaction failure rate is {{ $value | humanizePercentage }}"

      - alert: LowNewUserSignups
        expr: rate(user_signups_total[1h]) < 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Low user signups"
          description: "Only {{ $value }} signups in last hour"

      - alert: ContentUploadFailure
        expr: rate(content_uploads_total{status="failed"}[5m]) / rate(content_uploads_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Content upload failure rate >5%"
          description: "Content upload failure rate is {{ $value | humanizePercentage }}"

      - alert: PremiumContentAccessDenied
        expr: rate(premium_content_access_denied_total[5m]) > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High premium content access denials"
          description: "{{ $value }} access denials in last 5 minutes - check subscription service"

      # Reward Redemption Alerts
      - alert: RewardRedemptionFailure
        expr: rate(reward_redemptions_total{status="failed"}[5m]) / rate(reward_redemptions_total[5m]) > 0.03
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Reward redemption failure rate >3%"
          description: "Reward redemption failure rate is {{ $value | humanizePercentage }}"

      # Subscription Alerts
      - alert: SubscriptionCancellationSpike
        expr: rate(subscription_cancellations_total[1h]) > 2 * rate(subscription_cancellations_total[24h])
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Subscription cancellation spike detected"
          description: "Cancellation rate increased by 200% - current rate: {{ $value }}/hour"

      # Webhook Alerts
      - alert: WebhookFailureRate
        expr: rate(webhook_failures_total[5m]) / rate(webhook_events_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Webhook failure rate >10%"
          description: "Webhook failure rate is {{ $value | humanizePercentage }}"

      # External Service Alerts
      - alert: ExternalServiceDown
        expr: probe_success{job="external-services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "External service {{ $labels.instance }} down"
          description: "{{ $labels.instance }} is unreachable"

      # Backup Alerts
      - alert: BackupFailed
        expr: backup_last_success_timestamp < time() - 86400
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backup failed or not run in last 24h"
          description: "Last successful backup was at {{ $value }}"

      # Cache Alerts
      - alert: CacheMissRateHigh
        expr: rate(cache_misses_total[5m]) / (rate(cache_hits_total[5m]) + rate(cache_misses_total[5m])) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cache miss rate >30%"
          description: "Cache miss rate is {{ $value | humanizePercentage }}"

