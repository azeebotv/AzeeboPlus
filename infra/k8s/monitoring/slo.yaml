# SLO Definitions for Azeebo+ Platform
# Multi-window burn-rate alerts for each service
apiVersion: v1
kind: ConfigMap
metadata:
  name: slo-definitions
  namespace: azeebo
  labels:
    app.kubernetes.io/part-of: azeebo
data:
  slo.yaml: |
    services:
      auth-service:
        availability_slo: 99.9  # 43.8 min downtime/month
        latency_slo_ms: 200     # p99 latency
        error_rate_slo: 0.1     # max 0.1% errors
      user-service:
        availability_slo: 99.5
        latency_slo_ms: 500
        error_rate_slo: 0.5
      wallet-service:
        availability_slo: 99.95
        latency_slo_ms: 100
        error_rate_slo: 0.05
      payment-service:
        availability_slo: 99.99
        latency_slo_ms: 500
        error_rate_slo: 0.01
      content-service:
        availability_slo: 99.5
        latency_slo_ms: 500
        error_rate_slo: 1.0
    alert_rules:
      - name: HighErrorBurnRate
        condition: "sum(rate(http_requests_total{code=~'5..'}[5m])) / sum(rate(http_requests_total[5m])) > 14.4 * (1 - slo/100)"
        for: "2m"
        severity: critical
      - name: HighLatencyBurnRate
        condition: "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > slo_latency_ms / 1000"
        for: "5m"
        severity: warning
