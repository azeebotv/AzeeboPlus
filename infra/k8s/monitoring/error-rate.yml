groups:
  - name: error_rate_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected ({{ $value | humanizePercentage }})"
          description: "Error rate is above 5% for {{ $labels.service }} for more than 5 minutes."

      - alert: VeryHighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Very high error rate detected ({{ $value | humanizePercentage }})"
          description: "Error rate is above 10% for {{ $labels.service }} for more than 2 minutes."

      - alert: ElevatedErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.02
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elevated error rate detected ({{ $value | humanizePercentage }})"
          description: "Error rate is above 2% for {{ $labels.service }} for more than 10 minutes."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected ({{ $value }}s)"
          description: "95th percentile latency is above 1s for {{ $labels.service }}."

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."
