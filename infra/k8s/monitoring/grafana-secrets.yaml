# Grafana Admin Credentials - Use External Secrets in Production
# For production, replace with ExternalSecret CRD pointing to AWS Secrets Manager / GCP Secret Manager
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: azeebo-monitoring
type: Opaque
data:
  GF_SECURITY_ADMIN_USER: ""  # base64 encoded admin username
  GF_SECURITY_ADMIN_PASSWORD: ""  # base64 encoded admin password