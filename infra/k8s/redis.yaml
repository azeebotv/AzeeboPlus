apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: azeebo
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      serviceAccountName: azeebo-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            - $(REDIS_PASSWORD)
            - --tls-port
            - "6379"
            - --tls-cert-file
            - /etc/redis/tls/tls.crt
            - --tls-key-file
            - /etc/redis/tls/tls.key
            - --tls-ca-cert-file
            - /etc/redis/tls/ca.crt
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-tls
              mountPath: /etc/redis/tls
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["redis-cli", "-u", "$(redis-cli://:${REDIS_PASSWORD}@localhost:6379)", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "-u", "$(redis-cli://:${REDIS_PASSWORD}@localhost:6379)", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
        - name: redis-tls
          secret:
            secretName: redis-tls-cert
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: azeebo
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: azeebo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: azeebo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: redis