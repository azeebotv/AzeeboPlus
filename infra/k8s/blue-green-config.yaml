apiVersion: v1
kind: ConfigMap
metadata:
  name: blue-green-deploy-config
  namespace: azeebo
data:
  BLUE_GREEN_STRATEGY: "active-standby"
  SWITCH_TIMEOUT: "300"
  HEALTH_CHECK_INTERVAL: "10"
  HEALTH_CHECK_RETRIES: "3"
  ROLLBACK_ON_FAILURE: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blue-green-deploy-config
  namespace: azeebo-staging
data:
  BLUE_GREEN_STRATEGY: "active-standby"
  SWITCH_TIMEOUT: "180"
  HEALTH_CHECK_INTERVAL: "5"
  HEALTH_CHECK_RETRIES: "3"
  ROLLBACK_ON_FAILURE: "true"
