apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-service
  namespace: azeebo
  labels:
    app: queue-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: queue-service
  template:
    metadata:
      labels:
        app: queue-service
        tier: backend
    spec:
      containers:
        - name: queue-service
          image: azeebo/queue-service:latest
          ports:
            - containerPort: 3015
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3015"
            - name: REDIS_URL
              value: redis://redis.azeebo-infra.svc.cluster.local:6379
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@postgres.azeebo-infra.svc.cluster.local:5432/azeebo_plus_dev
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3015
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3015
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: queue-service
  namespace: azeebo
  labels:
    app: queue-service
spec:
  type: ClusterIP
  ports:
    - port: 3015
      targetPort: 3015
  selector:
    app: queue-service