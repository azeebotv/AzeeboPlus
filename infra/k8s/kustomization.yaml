apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: azeebo

resources:
  - namespace.yaml
  - secrets.yaml
  - auth-service.yaml
  - api-gateway.yaml
  - queue-service.yaml
  - web-app.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/name: azeebo-plus
  app.kubernetes.io/managed-by: kustomize

configMapGenerator:
  - name: azeebo-config
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=info