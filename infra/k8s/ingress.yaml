apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: azeebo-ingress
  namespace: azeebo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: api.azeebo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3013
    - host: app.azeebo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-app
                port:
                  number: 3000
    - host: creator.azeebo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: creator-portal
                port:
                  number: 3014
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
spec:
  controller: k8s.io/ingress-nginx