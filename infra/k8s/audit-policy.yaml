# Kubernetes Audit Policy Configuration
# This policy logs RBAC changes and critical security events
# Apply to API server with --audit-policy-file flag

apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  # RBAC changes - log all metadata level
  - level: Metadata
    resources:
      - group: rbac.authorization.k8s.io
        resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
  
  # Secret changes - log all requests
  - level: Request
    resources:
      - group: ""
        resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete"]
  
  # Deployment changes - log all
  - level: Metadata
    resources:
      - group: apps
        resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["create", "update", "patch", "delete"]
  
  # Pod exec - log at request level
  - level: Request
    resources:
      - group: ""
        resources: ["pods/exec"]
    verbs: ["create"]
  
  # Failed authentication
  - level: Metadata
    omitStages:
      - "RequestReceived"
    verbs: ["get", "list", "create", "update", "patch"]
    nonResourceURLs:
      - "/api*"
      - "/healthz*"
    outcome: Failure
  
  # Default deny-all for other events
  - level: None
    resources:
      - group: ""
        resources: ["events"]
    verbs: ["get", "list"]
  
  # Don't log watched events
  - level: None
    resources:
      - group: ""
        resources: ["*"]
    verbs: ["watch"]