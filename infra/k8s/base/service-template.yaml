apiVersion: apps/v1
kind: Deployment
metadata:
  name: SERVICE_NAME
  namespace: azeebo
  labels:
    app: SERVICE_NAME
    tier: backend
    app.kubernetes.io/part-of: azeebo-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "PORT"
    prometheus.io/path: "/metrics"
spec:
  replicas: REPLICA_COUNT
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: SERVICE_NAME
  template:
    metadata:
      labels:
        app: SERVICE_NAME
        tier: backend
        app.kubernetes.io/part-of: azeebo-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "PORT"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: azeebo-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - SERVICE_NAME
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - general-purpose
      containers:
        - name: SERVICE_NAME
          image: DOCKER_IMAGE:TAG
          imagePullPolicy: Always
          ports:
            - containerPort: PORT
              protocol: TCP
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "PORT"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: database-url
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: redis-url
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: jwt-secret
                  optional: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
              ephemeral-storage: "100Mi"
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "200Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: PORT
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /ready
              port: PORT
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /health
              port: PORT
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/node/.npm
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 50Mi
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: SERVICE_NAME
  namespace: azeebo
  labels:
    app: SERVICE_NAME
    app.kubernetes.io/part-of: azeebo-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "PORT"
spec:
  type: ClusterIP
  ports:
    - port: PORT
      targetPort: PORT
      protocol: TCP
      name: http
  selector:
    app: SERVICE_NAME