apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscription-service
  namespace: azeebo
  labels:
    app: subscription-service
    tier: backend
    app.kubernetes.io/part-of: azeebo-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3026"
    prometheus.io/path: "/metrics"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: subscription-service
  template:
    metadata:
      labels:
        app: subscription-service
        tier: backend
        app.kubernetes.io/part-of: azeebo-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3026"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: azeebo-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - subscription-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: subscription-service
          image: azeebo/subscription-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3026
              protocol: TCP
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3026"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: database-url
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: redis-url
                  optional: true
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: jwt-access-secret
                  optional: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
              ephemeral-storage: "100Mi"
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "200Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3026
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /ready
              port: 3026
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /health
              port: 3026
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/node/.npm
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 50Mi
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: subscription-service
  namespace: azeebo
  labels:
    app: subscription-service
    app.kubernetes.io/part-of: azeebo-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3026"
spec:
  type: ClusterIP
  ports:
    - port: 3026
      targetPort: 3026
      protocol: TCP
      name: http
  selector:
    app: subscription-service
