apiVersion: apps/v1
kind: Deployment
metadata:
  name: creator-portal-app
  namespace: azeebo
  labels:
    app: creator-portal-app
    tier: frontend
    app.kubernetes.io/part-of: azeebo-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4014"
    prometheus.io/path: "/metrics"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: creator-portal-app
  template:
    metadata:
      labels:
        app: creator-portal-app
        tier: frontend
        app.kubernetes.io/part-of: azeebo-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4014"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: azeebo-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - creator-portal-app
                topologyKey: kubernetes.io/hostname
      containers:
        - name: creator-portal-app
          image: azeebo/creator-portal-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4014
              protocol: TCP
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4014"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: API_GATEWAY_URL
              value: http://api-gateway.azeebo.svc.cluster.local:3013
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
              ephemeral-storage: "100Mi"
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "200Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 4014
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /
              port: 4014
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /
              port: 4014
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/node/.npm
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 50Mi
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: creator-portal-app
  namespace: azeebo
  labels:
    app: creator-portal-app
    app.kubernetes.io/part-of: azeebo-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4014"
spec:
  type: ClusterIP
  ports:
    - port: 4014
      targetPort: 4014
      protocol: TCP
      name: http
  selector:
    app: creator-portal-app
