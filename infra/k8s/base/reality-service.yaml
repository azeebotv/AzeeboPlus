apiVersion: apps/v1
kind: Deployment
metadata:
  name: reality-service
  namespace: azeebo
  labels:
    app: reality-service
    app.kubernetes.io/name: reality-service
    app.kubernetes.io/part-of: azeebo-plus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reality-service
  template:
    metadata:
      labels:
        app: reality-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: reality-service
          image: ghcr.io/azeebotv/azeebo-reality-service:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3010
          env:
            - name: PORT
              value: "3010"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: redis-url
            - name: NODE_ENV
              value: "production"
            - name: ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: allowed-origins
                  optional: true
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: jwt-access-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: jwt-refresh-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: reality-service
  namespace: azeebo
spec:
  selector:
    app: reality-service
  ports:
    - port: 80
      targetPort: 3010
  type: ClusterIP
