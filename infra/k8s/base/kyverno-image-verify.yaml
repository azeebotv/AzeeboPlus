# Kyverno ClusterPolicy: Verify cosign-signed container images
# Requires: Kyverno installed in the cluster
# This policy rejects any container image from ghcr.io/azeebo/* that
# doesn't have a valid Sigstore keyless cosign signature.
#
# Apply: kubectl apply -f infra/k8s/base/kyverno-image-verify.yaml
# Verify: kubectl run test-unsigned --image=nginx -n azeebo (should be REJECTED)
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Cosign Image Signatures
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Ensures all container images from the Azeebo+ registry (ghcr.io/azeebo*)
      are signed with Sigstore keyless cosign signatures. Unsigned images are
      rejected at admission time. This implements SLSA v1.0 Level 3 image
      integrity verification.
    kyverno.io/kyverno-version: 1.12.0
    kyverno.io/kubernetes-version: "1.28-1.30"
spec:
  validationFailureAction: Enforce
  background: true
  webhookTimeouts:
    mutatingWebhookTimeout: 10s
    validatingWebhookTimeout: 10s
  failurePolicy: Fail
  rules:
    - name: verify-cosign-signatures
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - azeebo
                - azeebo-staging
                - azeebo-monitoring
      exclude:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  kyverno.io/skip-image-verify: "true"
      context:
        - name: TRUSTED_REGISTRY
          variable:
            value: "ghcr.io"
      verifyImages:
        - imageReferences:
            - "ghcr.io/azeebo*"
          attestors:
            - count: 1
              entries:
                - keyless:
                    # Sigstore Fulcio root CA — keyless signing via GitHub Actions OIDC
                    url: https://fulcio.sigstore.dev
                    roots: |
                      -----BEGIN CERTIFICATE-----
                      MIIB9TCCAXugAwIBAgIUBRNMfMRGKfABo20kPk1GOYMqxiowCgYIKoZIzj0EAwMw
                      KjEVMBMGA1UEChMMc2lnc3RvcmUuZGV2MRUwEwYDVQQDEwxzaWdzdG9yZS1mdWxj
                      aW8wHhcNMjIwNDEzMDAwMDAwWhcNMzIwNTEzMDAwMDAwWjAqMRUwEwYDVQQKEwxz
                      aWdzdG9yZS5kZXYxFTATBgNVBAMTDHNpZ3N0b3JlLWZ1bGNpbzB2MBAGByqGSM49
                      AgEGBSuBBAAiA2IABLSyA7Ii/b0B2bFkBmIpx5GhJ3FpJMQ1eFmKDBYQCNQq6FGr
                      qpkVBDW2CZ+feQb+pJ/CjLjfnJwiCzRQJfKSlJGo4c9aZgdZMQxMfJb1T9MiBC8j
                      sN1UfP8xvF6zmlWm4aNjMGEwDgYDVR0PAQH/BAQDAgEGMBIGA1UdEwEB/wQIMAYB
                      Af8CAQEwHQYDVR0OBBYEFO6SJC5GkMMjMf/y5K3xOnIhPfMYMB8GA1UdIwQYMBaA
                      FO6SJC5GkMMjMf/y5K3xOnIhPfMYMAoGCCqGSM49BAMDA2kAMGYCMQDbwQYq0bIe
                      VZfIimKLSEpm/MjFjfuPMF+LvIz3bPOwJMvOaPqA0kNhSHPSBn1V5IIwCgYIKoZI
                      zj0EAwMDSAAwRQIgZ5xJFO0jCk/Pxap1bFNkmxQCGFnf/muwBeGIzPwWnYECIQCL
                      U+GnH7KPG04RxoSjPZ1UfvBi3RMGJLq5dlYm4pNqEQ==
                      -----END CERTIFICATE-----
                    identities:
                      - issuer: https://token.actions.githubusercontent.com
                        subjectRegExp: "^https://github\\.com/.*/\\.github/workflows/cd\\.yml@refs/(heads/main|tags/v.*)$"
      preconditions:
        all:
          - key: "{{ request.operation }}"
            operator: AnyIn
            value:
              - CREATE
              - UPDATE

    - name: disallow-unsigned-images
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - azeebo
                - azeebo-staging
      exclude:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  kyverno.io/skip-image-verify: "true"
      validate:
        message: >-
          All container images from ghcr.io/azeebo* must be signed with
          cosign keyless signatures. Use `cosign sign --yes <image>` in your
          CI/CD pipeline before deploying. See: https://docs.sigstore.dev/
        deny:
          conditions:
            all:
              - key: "{{ images.containers.*.reference | [?starts_with(@, 'ghcr.io/azeebo')] | length(@) }}"
                operator: GreaterThan
                value: 0
              # This deny rule acts as a fallback; the verifyImages rule above
              # handles actual signature verification. This rule catches edge
              # cases where verifyImages might not trigger.
