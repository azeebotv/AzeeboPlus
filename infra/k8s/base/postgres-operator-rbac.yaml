# PostgreSQL Operator Service Accounts and RBAC (Spilo/Zalando)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-operator
  namespace: azeebo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-operator-role
  namespace: azeebo
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments", "replicasets"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims", "configmaps", "secrets", "events"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["*"]
  - apiGroups: ["acid.zalan.do"]
    resources: ["postgresqls"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-operator-binding
  namespace: azeebo
subjects:
  - kind: ServiceAccount
    name: postgres-operator
    namespace: azeebo
roleRef:
  kind: Role
  name: postgres-operator-role
  apiGroup: rbac.authorization.k8s.io