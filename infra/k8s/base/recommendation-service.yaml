apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: azeebo
  labels:
    app: recommendation-service
    tier: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3009"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: azeebo-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      terminationGracePeriodSeconds: 30
      containers:
        - name: recommendation-service
          image: azeebo/recommendation-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3009
              protocol: TCP
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3009"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: redis-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3009
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3009
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: azeebo
  labels:
    app: recommendation-service
spec:
  type: ClusterIP
  ports:
    - port: 3009
      targetPort: 3009
      protocol: TCP
      name: http
  selector:
    app: recommendation-service