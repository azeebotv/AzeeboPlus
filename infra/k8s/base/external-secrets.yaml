# External Secrets Operator Configuration
# SecretStores for AWS Secrets Manager and GCP Secret Manager
# Note: Requires External Secrets Operator to be installed in the cluster

# AWS SecretStore (for AWS environments)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: azeebo
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets

---
# GCP Secret Store (for GCP environments)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: azeebo
spec:
  provider:
    gcpsm:
      projectId: azeebo-plus
      projectIdRef:
        name: gcp-project-id
        key: project-id

---
# ExternalSecret definitions for each application secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: azeebo-database-secret
  namespace: azeebo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: azeebo-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: /azeebo-plus/database/host
    - secretKey: DB_USER
      remoteRef:
        key: /azeebo-plus/database/user
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /azeebo-plus/database/password
    - secretKey: DB_NAME
      remoteRef:
        key: /azeebo-plus/database/name

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: azeebo-jwt-secret
  namespace: azeebo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: azeebo-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: /azeebo-plus/jwt/secret
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: /azeebo-plus/jwt/refresh-secret

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: azeebo-payment-keys
  namespace: azeebo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: azeebo-secrets
    creationPolicy: Owner
  data:
    - secretKey: PAYSTACK_SECRET_KEY
      remoteRef:
        key: /azeebo-plus/payments/paystack-secret
    - secretKey: FLUTTERWAVE_SECRET_KEY
      remoteRef:
        key: /azeebo-plus/payments/flutterwave-secret

---
# WAF Configuration for database
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wal-g
  namespace: azeebo
  labels:
    app: wal-g
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wal-g
  template:
    metadata:
      labels:
        app: wal-g
    spec:
      containers:
        - name: wal-g
          image: wal-g/wal-g:v2.0.0
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: WALG_S3_PREFIX
              value: s3://azeebo-backups-postgres/wal
            - name: PGDATA
              value: /var/lib/postgresql/data
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          command: ["wal-g", "postgres", "receive"]
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc