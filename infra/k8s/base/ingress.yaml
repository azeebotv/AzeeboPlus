apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: azeebo-ingress
  namespace: azeebo
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.azeeboplus.com,https://admin.azeeboplus.com,https://creator.azeeboplus.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization, X-Request-ID, X-Forwarded-For"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-rpm: "500"
    nginx.ingress.kubernetes.io/websocket-read-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.azeeboplus.com
        - app.azeeboplus.com
        - admin.azeeboplus.com
        - creator.azeeboplus.com
        - cdn.azeeboplus.com
      secretName: azeebo-tls
  rules:
    # All API traffic routes through the API gateway for centralized
    # authentication, rate limiting, request ID injection, and caching.
    - host: api.azeeboplus.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3013
    - host: app.azeeboplus.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-app
                port:
                  number: 3000
    - host: admin.azeeboplus.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-app
                port:
                  number: 4016
    - host: creator.azeeboplus.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: creator-portal-app
                port:
                  number: 4014
