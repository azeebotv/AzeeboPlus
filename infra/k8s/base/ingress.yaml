apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: azeebo-ingress
  namespace: azeebo
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.azeebo.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization, X-Request-ID, X-Forwarded-For"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-rpm: "500"
    nginx.ingress.kubernetes.io/websocket-read-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.azeebo.com
        - app.azeebo.com
        - admin.azeebo.com
        - cdn.azeebo.com
      secretName: azeebo-tls
  rules:
    - host: api.azeebo.com
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3000
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 3001
          - path: /wallet
            pathType: Prefix
            backend:
              service:
                name: wallet-service
                port:
                  number: 3002
          - path: /payment
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 3003
          - path: /content
            pathType: Prefix
            backend:
              service:
                name: content-service
                port:
                  number: 3004
          - path: /search
            pathType: Prefix
            backend:
              service:
                name: search-service
                port:
                  number: 3005
          - path: /notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 3006
          - path: /rewards
            pathType: Prefix
            backend:
              service:
                name: reward-service
                port:
                  number: 3007
          - path: /analytics
            pathType: Prefix
            backend:
              service:
                name: analytics-service
                port:
                  number: 3008
          - path: /recommendation
            pathType: Prefix
            backend:
              service:
                name: recommendation-service
                port:
                  number: 3009
          - path: /reality
            pathType: Prefix
            backend:
              service:
                name: reality-service
                port:
                  number: 3010
          - path: /creators
            pathType: Prefix
            backend:
              service:
                name: creator-service
                port:
                  number: 3018
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: media-service
                port:
                  number: 3019
          - path: /lifestyle
            pathType: Prefix
            backend:
              service:
                name: lifestyle-service
                port:
                  number: 3016
          - path: /vertical
            pathType: Prefix
            backend:
              service:
                name: vertical-service
                port:
                  number: 3017
          - path: /support
            pathType: Prefix
            backend:
              service:
                name: support-service
                port:
                  number: 3020
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3013
    - host: app.azeebo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-app
                port:
                  number: 8080
    - host: admin.azeebo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-app
                port:
                  number: 8080