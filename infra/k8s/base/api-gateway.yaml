apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: azeebo
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: azeebo-plus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: api-gateway
          image: ghcr.io/azeebotv/azeebo-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3013
          env:
            - name: NODE_ENV
              value: production
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: azeebo-config
                  key: redis-host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: azeebo-config
                  key: redis-port
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: jwt-refresh-secret
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: jwt-access-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: 3013
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3013
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: azeebo
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3013
      targetPort: 3013
  type: ClusterIP
