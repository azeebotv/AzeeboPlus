# PostgreSQL HA with Spilo (Zalando)
# Reference: https://github.com/zalando/postgres-operator
apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: azeebo-postgres-ha
  namespace: azeebo
spec:
  teamId: azeebo
  postgresql:
    version: "16"
    parameters:
      max_connections: "300"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_compression: "on"
      shared_preload_libraries: "pg_stat_statements"
  numberOfInstances: 3
  volume:
    size: 500Gi
    storageClass: gp3
  patroni:
    synchronous_mode: true
    synchronous_node_count: 2
  bootstrap:
    initdb:
      - encoding: UTF8
      - data-checksums
  enableBootstrapTenant: true