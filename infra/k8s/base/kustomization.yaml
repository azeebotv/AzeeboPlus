apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: azeebo

resources:
  - namespace.yaml
  - auth-service.yaml
  - user-service.yaml
  - wallet-service.yaml
  - payment-service.yaml
  - content-service.yaml
  - media-service.yaml
  - search-service.yaml
  - notification-service.yaml
  - reward-service.yaml
  - analytics-service.yaml
  - recommendation-service.yaml
  - reality-service.yaml
  - creator-service.yaml
  - lifestyle-service.yaml
  - vertical-service.yaml
  - support-service.yaml
  - queue-service.yaml
  - comedy-service.yaml
  - games-service.yaml
  - movie-service.yaml
  - moderation-service.yaml
  - engagement-service.yaml
  - messaging-service.yaml
  - referral-service.yaml
  - subscription-service.yaml
  - admin-app.yaml
  - creator-portal-app.yaml
  - ingress.yaml
  - hpa.yaml
  - pod-disruption-budgets.yaml
  - network-policies.yaml

commonLabels:
  app.kubernetes.io/name: azeebo-plus
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: azeebo-platform

configMapGenerator:
  - name: azeebo-config
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - API_GATEWAY_URL=http://api-gateway.azeebo.svc.cluster.local:3013
  - name: service-config
    literals:
      - LOG_FORMAT=json
      - REQUEST_TIMEOUT=30000
      - KEEP_ALIVE_TIMEOUT=65000

images:
  - name: azeebo/auth-service
    newTag: v1.0.0
  - name: azeebo/api-gateway
    newTag: v1.0.0
  - name: azeebo/user-service
    newTag: v1.0.0
  - name: azeebo/wallet-service
    newTag: v1.0.0
  - name: azeebo/payment-service
    newTag: v1.0.0
  - name: azeebo/content-service
    newTag: v1.0.0
  - name: azeebo/media-service
    newTag: v1.0.0
  - name: azeebo/search-service
    newTag: v1.0.0
  - name: azeebo/notification-service
    newTag: v1.0.0
  - name: azeebo/reward-service
    newTag: v1.0.0
  - name: azeebo/analytics-service
    newTag: v1.0.0
  - name: azeebo/recommendation-service
    newTag: v1.0.0
  - name: azeebo/reality-service
    newTag: v1.0.0
  - name: azeebo/creator-service
    newTag: v1.0.0
  - name: azeebo/lifestyle-service
    newTag: v1.0.0
  - name: azeebo/vertical-service
    newTag: v1.0.0
  - name: azeebo/support-service
    newTag: v1.0.0
  - name: azeebo/queue-service
    newTag: v1.0.0
  - name: azeebo/engagement-service
    newTag: v1.0.0
  - name: azeebo/messaging-service
    newTag: v1.0.0
  - name: azeebo/referral-service
    newTag: v1.0.0
  - name: azeebo/subscription-service
    newTag: v1.0.0
  - name: azeebo/admin-app
