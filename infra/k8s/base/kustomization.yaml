apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: azeebo

resources:
  - namespace.yaml
  - auth-service.yaml
  - user-service.yaml
  - wallet-service.yaml
  - payment-service.yaml
  - content-service.yaml
  - media-service.yaml
  - search-service.yaml
  - notification-service.yaml
  - reward-service.yaml
  - analytics-service.yaml
  - recommendation-service.yaml
  - reality-service.yaml
  - creator-service.yaml
  - lifestyle-service.yaml
  - vertical-service.yaml
  - support-service.yaml
  - queue-service.yaml
  - api-gateway.yaml
  - web-app.yaml
  - comedy-service.yaml
  - games-service.yaml
  - movie-service.yaml
  - moderation-service.yaml
  - ingress.yaml
  - hpa.yaml
  - pod-disruption-budgets.yaml
  - network-policies.yaml

commonLabels:
  app.kubernetes.io/name: azeebo
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: azeebo-platform

configMapGenerator:
  - name: azeebo-config
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - API_GATEWAY_URL=http://api-gateway.azeebo.svc.cluster.local:3013

configMapGenerator:
  - name: service-config
    literals:
      - LOG_FORMAT=json
      - REQUEST_TIMEOUT=30000
      - KEEP_ALIVE_TIMEOUT=65000

images:
  - name: azeebo/auth-service
    newTag: latest
  - name: azeebo/api-gateway
    newTag: latest
  - name: azeebo/user-service
    newTag: latest
  - name: azeebo/wallet-service
    newTag: latest
  - name: azeebo/payment-service
    newTag: latest
  - name: azeebo/content-service
    newTag: latest
  - name: azeebo/media-service
    newTag: latest
  - name: azeebo/search-service
    newTag: latest
  - name: azeebo/notification-service
    newTag: latest
  - name: azeebo/reward-service
    newTag: latest
  - name: azeebo/analytics-service
    newTag: latest
  - name: azeebo/recommendation-service
    newTag: latest
  - name: azeebo/reality-service
    newTag: latest
  - name: azeebo/creator-service
    newTag: latest
  - name: azeebo/lifestyle-service
    newTag: latest
  - name: azeebo/vertical-service
    newTag: latest
  - name: azeebo/support-service
    newTag: latest
  - name: azeebo/queue-service
    newTag: latest