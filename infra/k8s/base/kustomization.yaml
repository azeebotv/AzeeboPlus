apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: azeebo

resources:
  - namespace.yaml
  - auth-service.yaml
  - user-service.yaml
  - wallet-service.yaml
  - payment-service.yaml
  - ingress.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: azeebo
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: azeebo-platform

configMapGenerator:
  - name: azeebo-config
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - API_GATEWAY_URL=http://api-gateway.azeebo.svc.cluster.local:3000