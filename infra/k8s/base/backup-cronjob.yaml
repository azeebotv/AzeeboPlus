apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: azeebo
  labels:
    app: postgres-backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: postgres-backup
              image: postgres:15-alpine
              command:
                - /bin/sh
                - -c
                - |
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/azeebo_backup_${TIMESTAMP}.sql"
                  
                  pg_dump -h postgres -U postgres azeebo_prod > "${BACKUP_FILE}"
                  
                  if [ $? -eq 0 ]; then
                    echo "Backup completed successfully"
                  else
                    echo "Backup failed"
                    exit 1
                  fi
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: password
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-pvc
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-pvc
  namespace: azeebo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi