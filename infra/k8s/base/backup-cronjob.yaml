apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: azeebo
  labels:
    app: postgres-backup
    tier: infrastructure
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: azeebo-backup-sa
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: postgres-backup
              image: postgres:15-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_DIR="/backups"
                  BACKUP_FILE="${BACKUP_DIR}/azeebo_backup_${TIMESTAMP}.sql.gz"
                  ENCRYPTED_FILE="${BACKUP_FILE}.gpg"

                  echo "Starting backup at $(date)"

                  pg_dump -h postgres.azeebo.svc.cluster.local -U ${POSTGRES_USER} -d ${POSTGRES_DB} | gzip | \
                    gpg --batch --yes --encrypt --recipient ${GPG_RECIPIENT} -o "${ENCRYPTED_FILE}"

                  if [ $? -eq 0 ]; then
                    echo "Backup encrypted successfully: ${ENCRYPTED_FILE}"
                    echo "Upload to S3..."
                    aws s3 cp "${ENCRYPTED_FILE}" s3://${AWS_S3_BACKUP_BUCKET}/postgres/azeebo_backup_${TIMESTAMP}.sql.gz.gpg
                    echo "Upload complete"

                    echo "Verify backup..."
                    gpg --batch --decrypt --recipient ${GPG_RECIPIENT} "${ENCRYPTED_FILE}" | zcat | head -1 > /dev/null && echo "Backup verified"

                    echo "Cleanup local files..."
                    rm -f "${ENCRYPTED_FILE}"

                    echo "Backup completed at $(date)"
                  else
                    echo "Backup failed"
                    exit 1
                  fi
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: azeebo-secrets
                      key: postgres-user
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: azeebo-secrets
                      key: postgres-db
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: azeebo-secrets
                      key: database-password
                - name: GPG_RECIPIENT
                  valueFrom:
                    secretKeyRef:
                      name: azeebo-secrets
                      key: gpg-recipient
                - name: AWS_S3_BACKUP_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: azeebo-config
                      key: aws-s3-backup-bucket
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: azeebo-secrets
                      key: aws-access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: azeebo-secrets
                      key: aws-secret-access-key
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              volumeMounts:
                - name: backup-tmp
                  mountPath: /backups
          volumes:
            - name: backup-tmp
              emptyDir:
                sizeLimit: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-backup
  namespace: azeebo
  labels:
    app: redis-backup
    tier: infrastructure
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: azeebo-backup-sa
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: redis-backup
              image: redis:7-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_DIR="/backups"
                  BACKUP_FILE="${BACKUP_DIR}/redis_backup_${TIMESTAMP}.rdb.gz"
                  ENCRYPTED_FILE="${BACKUP_FILE}.gpg"

                  echo "Starting Redis backup at $(date)"

                  redis-cli -h redis.azeebo.svc.cluster.local SAVE

                  if [ $? -eq 0 ]; then
                    gzip -c /data/dump.rdb | gpg --batch --yes --encrypt --recipient ${GPG_RECIPIENT} -o "${ENCRYPTED_FILE}"

                    aws s3 cp "${ENCRYPTED_FILE}" s3://${AWS_S3_BACKUP_BUCKET}/redis/redis_backup_${TIMESTAMP}.rdb.gz.gpg

                    rm -f "${ENCRYPTED_FILE}"

                    echo "Redis backup completed at $(date)"
                  else
                    echo "Redis backup failed"
                    exit 1
                  fi
              env:
                - name: GPG_RECIPIENT
                  valueFrom:
                    secretKeyRef:
                      name: azeebo-secrets
                      key: gpg-recipient
                - name: AWS_S3_BACKUP_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name:azeebo-config
                      key: aws-s3-backup-bucket
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: azeebo-secrets
                      key: aws-access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: azeebo-secrets
                      key: aws-secret-access-key
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
              volumeMounts:
                - name: redis-backup-dir
                  mountPath: /data
                - name: backup-tmp
                  mountPath: /backups
          volumes:
            - name: redis-backup-dir
              persistentVolumeClaim:
                claimName: redis-data-pvc
            - name: backup-tmp
              emptyDir:
                sizeLimit: 500Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-verification
  namespace: azeebo
  labels:
    app: backup-verification
    tier: infrastructure
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: azeebo-backup-sa
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: backup-verification
              image: amazon/aws-cli:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Starting backup verification at $(date)"

                  LATEST_POSTGRES=$(aws s3 ls s3://${AWS_S3_BACKUP_BUCKET}/postgres/ | sort | tail -n 1 | awk '{print $4}')
                  LATEST_REDIS=$(aws s3 ls s3://${AWS_S3_BACKUP_BUCKET}/redis/ | sort | tail -n 1 | awk '{print $4}')

                  if [ -z "${LATEST_POSTGRES}" ]; then
                    echo "ERROR: No PostgreSQL backup found"
                    exit 1
                  fi

                  if [ -z "${LATEST_REDIS}" ]; then
                    echo "ERROR: No Redis backup found"
                    exit 1
                  fi

                  echo "Latest PostgreSQL backup: ${LATEST_POSTGRES}"
                  echo "Latest Redis backup: ${LATEST_REDIS}"

                  TEST_DIR="/tmp/backup_test"
                  mkdir -p ${TEST_DIR}

                  echo "Downloading PostgreSQL backup for verification..."
                  aws s3 cp s3://${AWS_S3_BACKUP_BUCKET}/postgres/${LATEST_POSTGRES} ${TEST_DIR}/pg_test.gpg

                  echo "Downloading Redis backup for verification..."
                  aws s3 cp s3://${AWS_S3_BACKUP_BUCKET}/redis/${LATEST_REDIS} ${TEST_DIR}/redis_test.gpg

                  echo "Verify PostgreSQL backup integrity..."
                  gpg --batch --decrypt --recipient ${GPG_RECIPIENT} ${TEST_DIR}/pg_test.gpg 2>/dev/null | zcat | head -10 > /dev/null && echo "PostgreSQL backup verified" || { echo "PostgreSQL backup verification failed"; exit 1; }

                  echo "Verify Redis backup integrity..."
                  gpg --batch --decrypt --recipient ${GPG_RECIPIENT} ${TEST_DIR}/redis_test.gpg 2>/dev/null | zcat | head -1 > /dev/null && echo "Redis backup verified" || { echo "Redis backup verification failed"; exit 1; }

                  rm -rf ${TEST_DIR}

                  echo "Backup verification completed at $(date)"
              env:
                - name: GPG_RECIPIENT
                  valueFrom:
                    secretKeyRef:
                      name: azeebo-secrets
                      key: gpg-recipient
                - name: AWS_S3_BACKUP_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: azeebo-config
                      key: aws-s3-backup-bucket
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: azeebo-secrets
                      key: aws-access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: azeebo-secrets
                      key: aws-secret-access-key
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"