# PgBouncer Connection Pooler for PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: azeebo
  labels:
    app: pgbouncer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: bitnami/pgbouncer:1.20
          ports:
            - containerPort: 5432
              name: postgresql
            - containerPort: 9127
              name: metrics
          env:
            - name: POSTGRESQL_HOST
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: DB_HOST
            - name: POSTGRESQL_PORT
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: DB_PORT
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: DB_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: DB_PASSWORD
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: DB_NAME
            - name: PGBOUNCER_DATABASE
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: DB_NAME
            - name: PGBOUNCER_PORT
              value: "5432"
            - name: PGBOUNCER_DEFAULT_POOL_SIZE
              value: "20"
            - name: PGBOUNCER_MAX_CLIENT_CONN
              value: "200"
            - name: PGBOUNCER_AUTH_TYPE
              value: "scram-sha-256"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -h 127.0.0.1 -p 5432
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -h 127.0.0.1 -p 5432
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: azeebo
  labels:
    app: pgbouncer
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9127"
spec:
  selector:
    app: pgbouncer
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
    - name: metrics
      port: 9127
      targetPort: 9127
  type: ClusterIP