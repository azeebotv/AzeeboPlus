# Staging Auth Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: azeebo-staging
  labels:
    app: auth-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: backend
    spec:
      containers:
        - name: auth-service
          image: azeebo/auth-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: staging
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: database-url
            - name: REDIS_URL
              value: redis://redis.azeebo-staging.svc.cluster.local:6379
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: jwt-access-secret
            - name: JWT_EXPIRES_IN
              value: "30m"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: azeebo-staging
  labels:
    app: auth-service
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: auth-service
