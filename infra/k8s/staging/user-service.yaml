# Staging User Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: azeebo-staging
  labels:
    app: user-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        tier: backend
    spec:
      containers:
        - name: user-service
          image: azeebo/user-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: staging
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: azeebo-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              value: redis://redis.azeebo-staging.svc.cluster.local:6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: azeebo-staging
  labels:
    app: user-service
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
  selector:
    app: user-service
