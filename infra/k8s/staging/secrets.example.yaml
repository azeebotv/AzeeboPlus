# Staging Secrets (Example - DO NOT COMMIT REAL SECRETS)
# This is a template - real secrets should be managed via:
# - kubectl create secret generic
# - AWS Secrets Manager
# - HashiCorp Vault
# - or other secret management solutions

apiVersion: v1
kind: Secret
metadata:
  name: azeebo-secrets
  namespace: azeebo-staging
type: Opaque
stringData:
  # Database
  DB_HOST: postgres.azeebo-staging.svc.cluster.local
  DB_PORT: "5432"
  DB_USER: azeebo_admin
  DB_PASSWORD: ${DB_PASSWORD}
  DB_NAME: azeebo_staging

  # Redis
  REDIS_HOST: redis.azeebo-staging.svc.cluster.local
  REDIS_PORT: "6379"

  # JWT
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

  # Payment Providers
  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
  PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET}
  FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY}
  FLUTTERWAVE_WEBHOOK_SECRET: ${FLUTTERWAVE_WEBHOOK_SECRET}

  # Notifications
  SENDGRID_API_KEY: ${SENDGRID_API_KEY}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
  TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
  FIREBASE_SERVER_KEY: ${FIREBASE_SERVER_KEY}

  # AWS
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_S3_BUCKET: ${AWS_S3_BUCKET}

  # Environment
  NODE_ENV: staging