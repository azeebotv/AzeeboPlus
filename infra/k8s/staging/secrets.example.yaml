# Staging Secrets (Example - DO NOT COMMIT REAL SECRETS)
# This is a template - real secrets should be managed via:
# - kubectl create secret generic
# - AWS Secrets Manager
# - HashiCorp Vault
# - or other secret management solutions

apiVersion: v1
kind: Secret
metadata:
  name: azeebo-secrets
  namespace: azeebo-staging
type: Opaque
stringData:
  # Database
  DB_HOST: postgres.azeebo-staging.svc.cluster.local
  DB_PORT: "5432"
  DB_USER: azeebo_admin
  DB_PASSWORD: your_secure_staging_password_here
  DB_NAME: azeebo_staging

  # Redis
  REDIS_HOST: redis.azeebo-staging.svc.cluster.local
  REDIS_PORT: "6379"

  # JWT
  JWT_SECRET: your_secure_jwt_secret_here
  JWT_REFRESH_SECRET: your_secure_refresh_secret_here

  # Payment Providers
  PAYSTACK_SECRET_KEY: sk_test_your_paystack_key
  FLUTTERWAVE_SECRET_KEY: FLWSECK_TEST-your_flutterwave_key

  # Notifications
  SENDGRID_API_KEY: SG.your_sendgrid_api_key
  TWILIO_ACCOUNT_SID: ACyour_twilio_account_sid
  TWILIO_AUTH_TOKEN: your_twilio_auth_token
  FIREBASE_SERVER_KEY: your_firebase_server_key

  # AWS
  AWS_ACCESS_KEY_ID: your_aws_access_key_id
  AWS_SECRET_ACCESS_KEY: your_aws_secret_access_key
  AWS_S3_BUCKET: azeebo-staging-media

  # Environment
  NODE_ENV: staging
