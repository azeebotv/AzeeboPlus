[databases]
; High-traffic databases (identity, money) - larger pool sizes
azeebo_plus_dev = host=postgres dbname=azeebo_plus_dev pool_size=30
azeebo_auth = host=postgres dbname=azeebo_auth pool_size=30
azeebo_wallet = host=postgres dbname=azeebo_wallet pool_size=30
azeebo_payment = host=postgres dbname=azeebo_payment pool_size=30

; Medium-traffic databases (content, user, search)
azeebo_user = host=postgres dbname=azeebo_user pool_size=20
azeebo_content = host=postgres dbname=azeebo_content pool_size=20
azeebo_media = host=postgres dbname=azeebo_media pool_size=20
azeebo_search = host=postgres dbname=azeebo_search pool_size=20
azeebo_notification = host=postgres dbname=azeebo_notification pool_size=15
azeebo_creator = host=postgres dbname=azeebo_creator pool_size=20

; Low-traffic databases (analytics, recommendation, background)
azeebo_reward = host=postgres dbname=azeebo_reward pool_size=10
azeebo_analytics = host=postgres dbname=azeebo_analytics pool_size=10
azeebo_recommendation = host=postgres dbname=azeebo_recommendation pool_size=10
azeebo_queue = host=postgres dbname=azeebo_queue pool_size=10
azeebo_engagement = host=postgres dbname=azeebo_engagement pool_size=10

; Universe databases (moderate traffic)
azeebo_reality = host=postgres dbname=azeebo_reality pool_size=15
azeebo_movie = host=postgres dbname=azeebo_movie pool_size=15
azeebo_games = host=postgres dbname=azeebo_games pool_size=15
azeebo_comedy = host=postgres dbname=azeebo_comedy pool_size=15
azeebo_sports = host=postgres dbname=azeebo_sports pool_size=15
azeebo_lifestyle = host=postgres dbname=azeebo_lifestyle pool_size=15
azeebo_vertical = host=postgres dbname=azeebo_vertical pool_size=15

; Minimal-traffic databases
azeebo_support = host=postgres dbname=azeebo_support pool_size=5
azeebo_moderation = host=postgres dbname=azeebo_moderation pool_size=5
azeebo_messaging = host=postgres dbname=azeebo_messaging pool_size=5
azeebo_referral = host=postgres dbname=azeebo_referral pool_size=5
azeebo_subscription = host=postgres dbname=azeebo_subscription pool_size=5
azeebo_admin = host=postgres dbname=azeebo_admin pool_size=5
azeebo_creator_portal = host=postgres dbname=azeebo_creator_portal pool_size=5

[pgbouncer]
listen_addr = *
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 3

; Connection lifecycle timeouts
server_idle_timeout = 300
server_lifetime = 1800
server_connect_timeout = 15
server_login_retry = 15
client_idle_timeout = 600
client_login_timeout = 60

; Query safety
query_timeout = 30
query_wait_timeout = 120

; TLS
server_tls_sslmode = require

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; Admin
admin_users = postgres
