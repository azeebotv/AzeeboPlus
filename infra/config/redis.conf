# Redis Persistence Configuration
# Append-only file for durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots (fallback)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes

# Memory management
maxmemory 256mb
maxmemory-policy noeviction

# Network
bind 127.0.0.1
tcp-keepalive 300
timeout 0

# Security
# NOTE: requirepass is set at runtime via entrypoint.sh or environment variable.
# Redis .conf files do NOT support shell variable expansion (${REDIS_PASSWORD}).
# The entrypoint generates this config with the actual password value.