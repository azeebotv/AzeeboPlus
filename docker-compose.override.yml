# ============================================================
# Azeebo+ — Development Overrides
# ============================================================
# This file is automatically loaded by `docker compose up`.
# It adds dev-only optimizations: hot-reload bind mounts,
# debug ports, relaxed logging, and verbose Postgres output.
#
# To skip this file (production-like):
#   docker compose -f docker-compose.yml up -d
# ============================================================

services:
  # --- Infrastructure: verbose logging for local dev ---
  postgres:
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=8MB
        -c maintenance_work_mem=128MB
        -c max_connections=100
        -c log_min_duration_statement=0
        -c log_statement=all
        -c log_duration=on
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  redis:
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"

  # --- Web app: hot-reload via bind mount ---
  web-app:
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./apps/web/src:/app/src:cached
      - ./apps/web/public:/app/public:cached
      - ./apps/web/next.config.js:/app/next.config.js:ro
    # Next.js dev server uses filesystem events; increase for Docker
    # (macOS Docker Desktop doesn't support inotify, so polling is needed)

  # --- All NestJS services: bind-mount source for hot-reload ---
  # Override build context to use dev Dockerfile with nodemon
  auth-service:
    build:
      context: .
      dockerfile: services/core/auth-service/Dockerfile
      target: development
    environment:
      NODE_ENV: development
    volumes:
      - ./services/core/auth-service/src:/app/src:cached
      - ./services/core/auth-service/prisma:/app/prisma:ro

  user-service:
