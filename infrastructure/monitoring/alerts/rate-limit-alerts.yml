groups:
  - name: rate_limit_alerts
    rules:
      - alert: HighRateLimitViolations
        expr: rate(rate_limit_exceeded_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate limit violations ({{ $value }}/s)"
          description: "Rate limit is being exceeded at a high rate. This may indicate abuse or misconfiguration."

      - alert: RateLimitViolationSpike
        expr: increase(rate_limit_exceeded_total[5m]) > 500
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Rate limit violation spike detected ({{ $value }} violations)"
          description: "More than 500 rate limit violations in the last 5 minutes. Possible DDoS or bot attack."

      - alert: SingleIPRateLimitAbuse
        expr: rate(rate_limit_exceeded_total{ip=~".+"}[5m]) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Single IP rate limit abuse from {{ $labels.ip }}"
          description: "IP {{ $labels.ip }} is hitting rate limits frequently."

      - alert: RateLimitConfigError
        expr: rate(rate_limit_config_error_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Rate limit configuration errors detected"
          description: "Rate limiting service is experiencing configuration errors."

      - alert: RedisConnectionFailure
        expr: rate(redis_connection_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis connection failures detected"
          description: "Rate limiting depends on Redis. Connection failures may cause rate limiting to fail open."
