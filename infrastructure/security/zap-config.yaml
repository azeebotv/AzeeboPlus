version: "2"
name: "Azeebo+ Security Scan"
target:
  url: "https://api.azeebo.com"
contexts:
  - name: "Azeebo+ API"
    urls:
      - "https://api.azeebo.com"
    includePaths:
      - "https://api.azeebo.com/.*"
    excludePaths:
      - "https://api.azeebo.com/health"
      - "https://api.azeebo.com/ready"
      - "https://api.azeebo.com/live"
    authentication:
      method: "bearer"
      parameters:
        header: "Authorization"
        value: "Bearer ${AUTH_TOKEN}"
    users:
      - name: "test-user"
        credentials:
          username: "test@example.com"
          password: "Password123!"
scanPolicy:
  name: "Default Policy"
  enabledRules:
